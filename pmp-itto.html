    <script>
      window.Param = {
        parse: function() {
          var params = {},
              search = window.location.search.substring(1),
              parts = search.split('&'),
              pairs = [];

          for(var i = 0, len = parts.length; i < len; i++) {
            pairs = parts[i].split('=');
            if(pairs[0] === '') continue
            params[pairs[0]] = (pairs.length > 1 ? pairs[1] : null);
          }

          return params;
        },
        toString: function(paramsHash) {
          var pairs = [];
          for(var key in paramsHash) {
            pairs.push(key + "=" + paramsHash[key]);
          }
          
          return window.location.href.split("?")[0] + "?" + pairs.join("&");
        },
        redirectTo: function(paramsHash) {
          window.location.href = window.Param.toString(paramsHash);
        }
      }

      var params = Param.parse();
      var t = params.t;
      // 8小时自动刷新（8*60*60*1000毫秒）
      if (typeof(t) === 'undefined' || (Date.now() - t) > 8*60*60*1000) {
        params.t = Date.now();
        Param.redirectTo(params);
      }

        // 显示工具与技术模态框
        function showToolsTechniquesModal() {
            const modal = document.getElementById('formulasModal');
            const modalFormulasList = document.getElementById('modalFormulasList');
            
            // 清空现有内容
            modalFormulasList.innerHTML = '';
            modalFormulasList.className = 'tools-techniques-list';
            
            // 修改模态框标题，添加搜索框
            const modalTitle = modal.querySelector('h2');
            modalTitle.innerHTML = `
                <div class="search-container">
                    <span>工具与技术</span>
                    <input type="text" class="search-input" placeholder="搜索工具与技术..." id="toolTechniqueSearch">
                </div>
            `;
            
            // 生成工具与技术列表
            function generateToolTechniqueList(filter = '') {
                modalFormulasList.innerHTML = '';
                
                const filteredTools = pmpData.tools_techniques.filter(toolTechnique => {
                    // 搜索名称、定义和特征
                    const searchText = filter.toLowerCase();
                    return (
                        toolTechnique.name.toLowerCase().includes(searchText) ||
                        (toolTechnique.definition && toolTechnique.definition.toLowerCase().includes(searchText)) ||
                        (toolTechnique.characteristics && toolTechnique.characteristics.some(char => char.toLowerCase().includes(searchText)))
                    );
                });
                
                // 添加表头
                if (filteredTools.length > 0) {
                    const headerRow = document.createElement('div');
                    headerRow.className = 'tools-techniques-header';
                    headerRow.innerHTML = `
                        <div class="tools-techniques-cell tool-name">名称</div>
                        <div class="tools-techniques-cell tool-definition">定义</div>
                        <div class="tools-techniques-cell tool-characteristics">特征</div>
                    `;
                    modalFormulasList.appendChild(headerRow);
                }
                
                // 添加工具与技术行
                filteredTools.forEach(toolTechnique => {
                    const toolRow = document.createElement('div');
                    toolRow.className = 'tools-techniques-row';
                    
                    toolRow.innerHTML = `
                        <div class="tools-techniques-cell tool-name">${toolTechnique.name}</div>
                        <div class="tools-techniques-cell tool-definition">${toolTechnique.definition || '暂无定义'}</div>
                        <div class="tools-techniques-cell tool-characteristics">
                            <ul>
                                ${toolTechnique.characteristics ? toolTechnique.characteristics.map(char => `<li>${char}</li>`).join('') : '<li>暂无特征信息</li>'}
                            </ul>
                        </div>
                    `;
                    
                    modalFormulasList.appendChild(toolRow);
                });

            // 初始生成完整列表
            generateToolTechniqueList();
            
            // 添加搜索功能
            const searchInput = document.getElementById('toolTechniqueSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    generateToolTechniqueList(this.value);
                });

            modal.style.display = 'block';
        }

        // 显示 ITTO 详情
        function showIttoDetail(process, knowledgeArea) {
            document.getElementById('matrixTab').style.display = 'none';
            document.getElementById('ittoDetailTab').style.display = 'block';

            // 设置过程信息 - 标签样式
            document.getElementById('processMeta').innerHTML = `
                <div class="process-tags">
                    过程<span class="tag process-tag">${process.name}</span>
                    知识领域<span class="tag knowledge-area-tag">${knowledgeArea.name}</span>
                    过程组<span class="tag process-group-tag ${process.process_group}">${getProcessGroupName(process.process_group)}</span>
                </div>
                <div class="process-description">
                    <p>描述：${process.description || '暂无描述'}</p>
                    <p>作用：${process.function || '暂无作用说明'}</p>
                </div>
            `;
            
            // 生成同一知识领域的横向过程列表
            const processList = document.getElementById('processList');
            processList.innerHTML = '';
            
            knowledgeArea.processes.forEach(areaProcess => {
                const processItem = document.createElement('div');
                processItem.className = `process-item ${areaProcess.process_group}`;
                
                // 如果是当前选中的过程，添加active类
                if (areaProcess.id === process.id) {
                    processItem.classList.add('active');
                }
                
                processItem.textContent = areaProcess.name;
                processItem.title = `${areaProcess.name} (${getProcessGroupName(areaProcess.process_group)})`;
                processItem.onclick = () => {
                    // 找到该过程所属的知识领域
                    let processKnowledgeArea = null;
                    for (const area of pmpData.knowledge_areas) {
                        const found = area.processes.find(p => p.id === areaProcess.id);
                        if (found) {
                            processKnowledgeArea = area;
                            break;
                        }
                    }
                    
                    // 显示该过程的ITTO详情
                    if (processKnowledgeArea) {
                        showIttoDetail(areaProcess, processKnowledgeArea);
                    }
                };
                
                processList.appendChild(processItem);
            });

            // 填充输入
            const inputsList = document.getElementById('inputsList');
            inputsList.innerHTML = '';
            process.inputs.forEach(input => {
                const li = document.createElement('li');
                li.textContent = input;
                li.style.cursor = 'pointer';
                li.style.textDecoration = 'none';
                li.style.color = '#3498db';
                li.onclick = () => showConceptModal(input, 'input');
                inputsList.appendChild(li);
            });

            // 填充工具与技术
            const toolsTechniquesList = document.getElementById('toolsTechniquesList');
            toolsTechniquesList.innerHTML = '';
            process.tools_techniques.forEach(tool => {
                const li = document.createElement('li');
                li.textContent = tool;
                li.style.cursor = 'pointer';
                li.style.textDecoration = 'none';
                li.style.color = '#3498db';
                li.onclick = () => showConceptModal(tool, 'tool');
                toolsTechniquesList.appendChild(li);
            });

            // 填充输出
            const outputsList = document.getElementById('outputsList');
            outputsList.innerHTML = '';
            process.outputs.forEach(output => {
                const li = document.createElement('li');
                li.textContent = output;
                li.style.cursor = 'pointer';
                li.style.textDecoration = 'none';
                li.style.color = '#3498db';
                li.onclick = () => showConceptModal(output, 'output');
                outputsList.appendChild(li);
            });
        }

        // 返回矩阵
        function showMatrix() {
            document.getElementById('matrixTab').style.display = 'block';
            document.getElementById('ittoDetailTab').style.display = 'none';
        }

        // 过滤矩阵
        function filterMatrix() {
            const dropdownContainer = document.getElementById('knowledgeAreaFilter');
            const checkboxesContainer = dropdownContainer.querySelector('.knowledge-area-checkboxes');
            const checkboxes = checkboxesContainer.querySelectorAll('input[type="checkbox"]');
            const selectedOptions = Array.from(checkboxes)
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.value);
            
            const table = document.getElementById('knowledgeMatrix');
            const tbody = table.querySelector('tbody');
            const rows = tbody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const areaId = row.getAttribute('data-area-id');
                let showRow = true;
                
                // 按知识领域过滤（多选）
                if (!selectedOptions.includes(areaId)) {
                    showRow = false;
                }
                
                row.style.display = showRow ? '' : 'none';
            });
        }

        // 获取过程组名称
        function getProcessGroupName(processGroupId) {
            const group = pmpData.process_groups.find(g => g.id === processGroupId);
            return group ? group.name : '';
        }
        
        // 显示概念解释模态框
        function showConceptModal(item, type) {
            const modal = document.getElementById('conceptModal');
            const content = document.getElementById('conceptModalContent');
            
            // 当类型为 tool 时，从 pmpData.tools_techniques 中获取详细信息
            if (type === 'tool') {
                // 查找对应的工具与技术
                let toolTechnique = null;
                for (const tt of pmpData.tools_techniques) {
                    if (tt.name === item) {
                        toolTechnique = tt;
                        break;
                    }
                }
                
                if (toolTechnique) {
                    // 生成被使用的子过程列表
                    let usedInList = '';
                    if (toolTechnique.used_in && toolTechnique.used_in.length > 0) {
                        // 查找每个子过程的名称
                        const processNames = toolTechnique.used_in.map(processId => {
                            for (const area of pmpData.knowledge_areas) {
                                const process = area.processes.find(p => p.id === processId);
                                if (process) {
                                    return process.name;
                                }
                            }
                            return processId;
                        });
                        usedInList = processNames.map(name => `<li>${name}</li>`).join('');
                    }
                    
                    // 生成特征列表
                    let characteristicsList = '';
                    if (toolTechnique.characteristics && toolTechnique.characteristics.length > 0) {
                        characteristicsList = toolTechnique.characteristics.map(char => `<li>${char}</li>`).join('');
                    }
                    
                    content.innerHTML = `
                        <h2>${toolTechnique.name}</h2>
                        
                        <div class="concept-section">
                            <h3>定义</h3>
                            <p>${toolTechnique.definition || '暂无定义'}</p>
                        </div>
                        
                        <div class="concept-section">
                            <h3>特征</h3>
                            <ul>
                                ${characteristicsList || '<li>暂无特征信息</li>'}
                            </ul>
                        </div>
                        
                        <div class="concept-section">
