    box.style.cssText = 'margin:16px auto;max-width:920px;padding:12px 16px;border-radius:8px;' +
      'background:#fff4e5;border:1px solid #ffb74d;color:#663c00;font-size:14px;line-height:1.8';
    box.innerHTML = '⚠️ <b>数据文件缺失</b>：<code>web2md</code> 是生成物，已不再随 git 分发。' +
      '<br>请先在仓库根目录跑一次：<code>' + CMD + '</code>，生成数据文件后刷新本页。';
    if (!document.getElementById('web2mdDataMissing')) {
      document.body.insertBefore(box, document.body.firstChild);
    }
  }
  function check() {
    if (window.WEB2MD_DATA) return;           // 数据已载入 ⇒ 正常渲染，不打扰
    if (window.__cl038Probe) { show(); return; }
    window.__cl038Probe = true;
    show();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', check);
  else check();
})();
</script>


<script>
(function() {
  /* ═══════════════════════════════════════════
     Layout Table v2.0 — 增强版
     新增：Tabs/Sort指示/数字排序/中文排序/统计/操作列/Toast/
           列可见性/行选择/CSV导出/行点击/列宽拖拽/Tab记忆/实时搜索
     ═══════════════════════════════════════════ */

  /* ═══════════════════════════════════════════
     web2md 配置（按 html-gen table 规范；runtime 与 efficiency/git-cloner.html 同源）
     契约真源: documents/solutions/web2md-gitcloner-linkage-tags-plugin-sync-design-v1.0-20260925.md §15.5
     标题/描述为单源：见 <h1> 与 .table-desc（不保留未消费的 JS 常量）
     ═══════════════════════════════════════════ */

  // 列（契约 data js: items[].{title,platform,author,publish_date,article_id,tags,projects,completed_steps}
  //   缺字段一律优雅降级：标签列空、关联列 0、状态空 —— 不报错、不伪造）：
  //  - title        标题（freeze 左冻结 + onCellClick=split 点击进分栏）
  //  - platform     平台 / author 作者 / publish_date 日期（datetime 排序）
  //  - tags         标签 pills（type=tags，点 pill = 按标签筛选）
  //  - projects     关联项目（type=list，数量 + 点击分栏逐条列 owner_repo/克隆态）
  //  - completed_steps 状态（数组 → 顿号连接展示）
  //  - actions      右固定列：📋 复制命令 / 🤖 复制给 AI / ⌨️ 复制句柄 / 📄 打开原文（hrefKey=url）
  //  扩展列全部 initialHidden（⚙️ 面板可开；分栏详情/CSV 全列渲染）
  const COLUMNS = [
    {"key": "title", "label": "标题", "sortable": true, "locale": "zh", "width": "320px",
     "freeze": true, "onCellClick": "split", "splitFull": true},
    {"key": "platform", "label": "平台", "sortable": true, "width": "110px"},
    {"key": "author", "label": "作者", "sortable": true, "width": "110px"},
    {"key": "publish_date", "label": "日期", "type": "datetime", "sortable": true, "width": "105px"},
    {"key": "tags", "label": "🏷 标签", "type": "tags", "tagClick": true,
     "width": "190px", "splitFull": true},
    {"key": "projects", "label": "🔗 关联项目", "type": "list",
     "width": "110px", "onCellClick": "split", "listLabel": "owner_repo", "listSub": "cloned"},
    {"key": "completed_steps", "label": "状态", "sortable": true, "width": "130px", "splitFull": true},
    {"key": "actions", "label": "操作", "type": "actions", "width": "180px",
     "stickyRight": true, "actions": [
      {"icon": "📋", "label": "复制 web2md info 命令", "handler": "web2mdCopyInfo"},
      {"icon": "🤖", "label": "复制 AI 上下文块（元信息 + 智读分析）", "handler": "web2mdCopyAiBlock"},
      {"icon": "⌨️", "label": "复制命令行句柄（agent 自取最新）", "handler": "web2mdCopyHandle"},
      {"icon": "📄", "label": "打开原文", "hrefKey": "url"}
    ]},
    // ── 契约扩展字段（初始收起；分栏详情全列渲染时显示）──
    {"key": "url", "label": "原文地址", "width": "280px", "initialHidden": true, "splitFull": true},
    {"key": "article_id", "label": "文章 ID", "width": "160px", "initialHidden": true},
    {"key": "reading_suggestion", "label": "阅读建议", "width": "120px", "initialHidden": true},
    {"key": "last_updated", "label": "最近变更", "type": "datetime", "width": "150px", "initialHidden": true}
  ];

  // OPTIONS：search 搜索框默认开（CMD+F 行为）+ clickModes split/modal + columnsSplit 分栏列集 +
  //          searchFields 限定字段（值走 cellText → tags 数组按展示名匹配）+ exportCSV 开导出
  const OPTIONS = {
    "search": true,
    "searchFields": ["title", "platform", "author", "tags"],
    "clickModes": ["split", "modal"],
    "columnsSplit": ["title", "tags", "projects", "actions"],
    "exportCSV": true
  };

  // DATA 初始空数组；启动时由 w2mLoadRange() 从 web2md-data.js（同步）填充
  const DATA = [];

  // range tabs（不走 runtime tabs，自定义切换；本页数据在本地按日期字段过滤）
  const RANGE_TABS = [
    {"key": "today", "label": "今天"},
    {"key": "7d", "label": "最近7天"},
    {"key": "30d", "label": "最近30天"},
    {"key": "all", "label": "所有"}
  ];
  const RANGE_EMPTY = {
    "today": "📭 今日无文章",
    "7d": "📭 最近7天无文章",
    "30d": "📭 最近30天无文章",
    "all": "📭 暂无文章"
  };

  // TABS 起手为空，数据到位后由 buildPlatformTabs() 按 platform 去重动态填充
  // （TABS[0] = 「全部」= runtime 的全量 tab 语义；key 直接取 platform 值，中文平台名可直接入 URL）
  const TABS = [];

  // 暴露 RANGE_TABS/RANGE_EMPTY 到 window 供外部 script（selectRange/initRangeTabs）使用
  window.RANGE_TABS = RANGE_TABS;
  window.RANGE_EMPTY = RANGE_EMPTY;

  // Support columnsSplit for dedicated split-mode columns
  if (OPTIONS && OPTIONS.columnsSplit) {
    COLUMNS._splitCols = OPTIONS.columnsSplit;
  }

  // CL009: GitHub Issue 反馈通道 — options.feedback={repo,dataset,key,altKey,template}
  // 未配置 repo（或显式空串）→ 不渲染反馈按钮（既有页面零变更）
  const FB_CFG  = (OPTIONS && OPTIONS.feedback) || null;
  const FB_REPO = (FB_CFG && FB_CFG.repo) ? String(FB_CFG.repo) : '';

  const PAGE_SIZE = (OPTIONS && OPTIONS.pageSize) || 30;
  const showExport = OPTIONS && OPTIONS.exportCSV;
  const showRowSelect = OPTIONS && OPTIONS.rowSelect;
  const showIndex = OPTIONS && OPTIONS.showIndex;
  const columnResize = !(OPTIONS && OPTIONS.columnResize === false);  // true by default
  const showSearch = OPTIONS ? OPTIONS.search !== false : true;

  let filtered = DATA.slice(), currentPage = 1, activeTab = '', sortKey = '', sortAsc = true;
  let selectedRows = {}, colVisibility = {};
  // Restore column visibility from localStorage
  try { colVisibility = JSON.parse(localStorage.getItem('web2md:table:col-visibility')) || {}; } catch(e) {}
  // initialHidden: 表格默认隐藏列（⚙️ 可开启；分栏详情全列渲染不受影响）；用户切换过则尊重用户
  COLUMNS.forEach(function(c) { if (c.initialHidden && colVisibility[c.key] === undefined) colVisibility[c.key] = false; });
  let density = 'default', clickMode = 'tab', splitRatio = 40, splitActive = false;
  let expandedIdx = -1;
  let quickFilter = null;  // {key, value}

  // Restore from localStorage
  try { density = localStorage.getItem('web2md:table:density') || 'default'; } catch(e) {}
  try { clickMode = localStorage.getItem('web2md:table:click-mode') || 'tab'; } catch(e) {}
  try { splitRatio = parseFloat(localStorage.getItem('web2md:table:split-ratio')) || 40; } catch(e) {}

  /* ── Security: HTML escape ── */
  function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  /* ── CL036: 数组/对象值 → 展示文本（tags/list 列与搜索/导出/分栏详情共用） ──
     契约里 tags/projects/articles 均为对象数组：直接 String() 会落 [object Object]，
     故统一走 cellText（数组 → 顿号连接；对象 → 取首个非空命名键）。 */
  function pillText(x) {
    if (x === null || x === undefined) return '';
    if (typeof x === 'object') {
      return String(x.display_name || x.name || x.label || x.title || x.owner_repo || x.id || x.url || '');
    }
    return String(x);
  }
  function cellText(v) {
    if (v === null || v === undefined) return '';
    if (Array.isArray(v)) return v.map(pillText).filter(function(s) { return s !== ''; }).join('、');
    if (typeof v === 'object') return pillText(v);
    return String(v);
  }
  // 标签 id（筛选与 ?tag= URL 用；契约 tags:[{id,display_name}]，兼容纯字符串/顿号串）
  function tagIdOf(x) {
    if (x && typeof x === 'object') return String(x.id || x.name || '');
    return (x === null || x === undefined) ? '' : String(x);
  }
  function normalizeTagArray(v) {
    if (v === null || v === undefined || v === '') return [];
    if (Array.isArray(v)) return v.filter(function(x) { return x !== null && x !== undefined && x !== ''; });
    return String(v).split(/[,，、/]+/).map(function(s) { return s.trim(); }).filter(Boolean);
  }
  // 行标签 id 集合：loader 预算 _tagIds 优先（快），缺失/未归一 → 即时从 tags 派生（健壮）
  function rowTagIds(row) {
    if (row && row._tagIds) return row._tagIds;
    var out = [];
    normalizeTagArray(row && row.tags).forEach(function(t) {
      var id = tagIdOf(t);
      if (id && out.indexOf(id) === -1) out.push(id);
    });
    return out;
  }

  /* ── Visible columns (respects visibility toggle + split mode preview filter) ── */
  function visibleCols(opts) {
    opts = opts || {};
    return COLUMNS.filter(function(c) {
      if (opts.requireKey && !c.key) return false;
      if (opts.excludeActions && c.type === 'actions') return false;
      if (c.hide) return false;
      if (colVisibility[c.key] === false) return false;
      // split mode: use columnsSplit if defined, else preview filter
      if (splitActive) {
        if (COLUMNS._splitCols) {
          return COLUMNS._splitCols.indexOf(c.key) !== -1;
        }
        var hasAnyPreview = COLUMNS.some(function(x) { return x.preview === true; });
        if (hasAnyPreview && c.preview !== true) return false;
      }
      return true;
    });
  }

  /* ── Tabs ── */
  function buildTabs() {
    const bar = document.getElementById('tabsBar');
    if (!TABS || !TABS.length) { bar.innerHTML = ''; return; }
    if (!activeTab) {
      try { activeTab = localStorage.getItem('web2md:table:tab'); } catch(e) {}
      if (!activeTab || !TABS.find(function(t){return t.key===activeTab})) activeTab = TABS[0].key;
    }
    bar.innerHTML = TABS.map(function(t) {
      var cnt = t.key === TABS[0].key ? DATA.length :
        DATA.filter(function(row) { return matchTab(row, t); }).length;
      return '<div class="tab-btn'+(t.key===activeTab?' active':'')+'" onclick="switchTab(\''+t.key+'\')">'+t.label+'<span class="count">'+cnt+'</span></div>';
    }).join('');
  }

  function matchTab(row, tab) {
    if (tab.match) return row[tab.match] === tab.key;
    if (tab.contains) {
      var val = row[tab.field || 'profiles'] || '';
      var target = tab.value || tab.key;
      return val.split(/[,，、/]+/).map(function(s){return s.trim();}).indexOf(target) !== -1;
    }
    if (tab.field) return row[tab.field] === tab.key;
    return (row.group || row.category || '') === tab.key;
  }

  /* ── Filter & Sort ── */
  function applyFilters() {
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    filtered = DATA.slice();
    // Tab filter
    if (activeTab && TABS && TABS.length && activeTab !== TABS[0].key) {
      var tab = TABS.find(function(t){return t.key===activeTab;});
      if (tab) filtered = filtered.filter(function(row){return matchTab(row, tab);});
    }
    // Search filter（options.searchFields 限定字段，默认全列向后兼容；v3.4.0: 值走 cellText →
    // tags/articles 等数组列按展示文本匹配，不再落 [object Object] 噪音）
    if (q) {
      var searchKeys = (OPTIONS && OPTIONS.searchFields) ||
        COLUMNS.filter(function(c){ return c.type !== 'actions' && c.type !== 'videos' && c.key; }).map(function(c){ return c.key; });
      filtered = filtered.filter(function(row) {
        return searchKeys.some(function(k) {
          return cellText(row[k]).toLowerCase().indexOf(q) !== -1;
        });
      });
    }
    // Quick filter (cell click / pill click)
    if (quickFilter) {
      filtered = filtered.filter(function(row) {
        var v = cellText(row[quickFilter.key]);
        if (quickFilter.mode === 'contains') {
          // 标签筛选：顿号/逗号切分后包含匹配
          return v.split(/[,，、/]+/).map(function(s){return s.trim();}).indexOf(quickFilter.value) !== -1;
        }
        return v === quickFilter.value;
      });
    }
    // 标签筛选（CL036：组内并集 + 多标签交集，与 CLI `list --tag/--tag-group` 同口径）
    if (tagFilterActive()) {
      filtered = filtered.filter(tagFilterMatch);
    }
    // Sort (primary + secondary combined for stable ordering)
    if (sortKey) {
      var col = COLUMNS.find(function(c){return c.key===sortKey;});
      var isNum = col && col.type === 'number';
      var isDate = col && col.type === 'datetime';
      var loc = col && col.locale;
      var col2 = sortKey2 ? COLUMNS.find(function(c){return c.key===sortKey2;}) : null;
      var isNum2 = col2 && col2.type === 'number';
      var isDate2 = col2 && col2.type === 'datetime';
      var loc2 = col2 && col2.locale;
      filtered.sort(function(a, b) {
        // Primary key
        var va = a[sortKey], vb = b[sortKey];
        if (va === undefined || va === null) va = '';
        if (vb === undefined || vb === null) vb = '';
        var cmp;
        if (isNum) { va = parseFloat(va)||0; vb = parseFloat(vb)||0; cmp = va - vb; }
        else if (isDate) { va = Date.parse(va) || 0; vb = Date.parse(vb) || 0; cmp = va - vb; }
        else { va = String(va); vb = String(vb); cmp = loc ? va.localeCompare(vb, loc) : va.localeCompare(vb); }
        if (cmp !== 0) return sortAsc ? cmp : -cmp;
        // Secondary key (only when primary equal)
        if (col2 && sortKey2 !== sortKey) {
          var va2 = a[sortKey2], vb2 = b[sortKey2];
          if (va2 === undefined || va2 === null) va2 = '';
          if (vb2 === undefined || vb2 === null) vb2 = '';
          var cmp2;
          if (isNum2) { va2 = parseFloat(va2)||0; vb2 = parseFloat(vb2)||0; cmp2 = va2 - vb2; }
          else if (isDate2) { va2 = Date.parse(va2) || 0; vb2 = Date.parse(vb2) || 0; cmp2 = va2 - vb2; }
          else { va2 = String(va2); vb2 = String(vb2); cmp2 = loc2 ? va2.localeCompare(vb2, loc2) : va2.localeCompare(vb2); }
          return sortAsc2 ? cmp2 : -cmp2;
        }
        return 0;
      });
    }
  }

  /* ═══════════════════════════════════════════
     CL036 标签筛选（组下拉 → 标签多选级联 → 前端过滤 + URL 写回 ?tag=&tagGroup=）
     口径与 CLI 同源：多标签 = 交集（`list --tag a --tag b`）；标签组 = 组内并集（`list --tag-group g`）
     标签库：数据 js 的 taxonomy（或顶层 groups/tags）优先；缺失 → 从行内 tags 聚合（仅缺组信息，仍可筛选）
     ═══════════════════════════════════════════ */
  var TAG_FILTER_KEY = 'web2md:table:tag-filter';
  var TAG_INDEX = {groups: [], tags: []};
  var tagFilter = {group: '', tags: []};

  function tagById(id) {
    return TAG_INDEX.tags.find(function(t) { return t.id === id; }) || null;
  }
  function tagDisplay(id) {
    var t = tagById(id);
    return t ? t.display_name : String(id);
  }
  function groupDisplay(id) {
    var g = TAG_INDEX.groups.find(function(x) { return x.id === id; });
    return g ? g.display_name : String(id);
  }
  function tagFilterActive() { return !!(tagFilter.group || tagFilter.tags.length); }

  // 行是否命中当前筛选：多标签取交集 + 组取组内并集（缺 tags 字段的行 = 无标签，仅在启用筛选时被排除）
  function tagFilterMatch(row) {
    if (tagFilter.tags.length) {
      var ids = rowTagIds(row);
      for (var i = 0; i < tagFilter.tags.length; i++) {
        if (ids.indexOf(tagFilter.tags[i]) === -1) return false;
      }
    }
    if (tagFilter.group) {
      var gids = TAG_INDEX.tags.filter(function(t) { return t.group_id === tagFilter.group; })
                              .map(function(t) { return t.id; });
      if (!gids.length) return false;
      var rowIds = rowTagIds(row);
      if (!gids.some(function(id) { return rowIds.indexOf(id) !== -1; })) return false;
    }
    return true;
  }

  // 标签库构建（loader 在数据到位后调用；DATA 已填充）
  window.tableBuildTagIndex = function(data) {
    var idx = {groups: [], tags: []};
    var seen = {}, gseen = {};
    function addGroup(g) {
      var id = String((g && (g.id || g.name)) || '');
      if (!id || gseen[id]) return;
      gseen[id] = 1;
      idx.groups.push({id: id, display_name: String((g && (g.display_name || g.name)) || id)});
    }
    function addTag(t) {
      var id = tagIdOf(t);
      if (!id || seen[id]) return;
      seen[id] = 1;
      var gid = (t && typeof t === 'object' && t.group_id) ? String(t.group_id) : '';
      idx.tags.push({id: id,
                     display_name: (t && typeof t === 'object') ? String(t.display_name || t.name || id) : id,
                     group_id: gid});
      if (gid) addGroup({id: gid, display_name: (t && t.group_display_name) || gid});
    }
    var tax = (data && data.taxonomy) || {};
    ((tax.groups || (data && data.groups)) || []).forEach(addGroup);
    ((tax.tags || (data && data.tags)) || []).forEach(addTag);
    DATA.forEach(function(row) {
      normalizeTagArray(row && row.tags).forEach(addTag);
    });
    idx.tags.sort(function(a, b) { return a.display_name.localeCompare(b.display_name, 'zh'); });
    idx.groups.sort(function(a, b) { return a.display_name.localeCompare(b.display_name, 'zh'); });
    TAG_INDEX = idx;
    renderTagFilterUI();
    return idx;
  };

  function persistTagFilter() {
    try { localStorage.setItem(TAG_FILTER_KEY, JSON.stringify(tagFilter)); } catch(e) {}
  }

  // 起手快照读法：loader 会在首次 syncUrlState 前把 ?tag/?tagGroup= 快照到 window.tablePendingTagState
  // （syncUrlState 会把尚未生效的 tag 参数从 URL 剔除，之后再读 location.search 就晚了 —— 与 ?split 同坑）
  function readUrlTagState() {
    try {
      var p = new URLSearchParams(location.search);
      var g = p.get('tagGroup');
      var ts = p.getAll('tag');
      if (g !== null || ts.length) return {group: g || '', tags: ts};
    } catch(e) {}
    return null;
  }

  // 恢复优先级：URL(?tag=&tagGroup=) > localStorage（与 range 同口径）；非法值忽略，不报错
  window.tableRestoreTagState = function() {
    var fromUrl = (window.tablePendingTagState === undefined) ? readUrlTagState() : window.tablePendingTagState;
    var state = fromUrl;
    if (!state) {
      try { state = JSON.parse(localStorage.getItem(TAG_FILTER_KEY)); } catch(e) { state = null; }
    }
    if (!state) { renderTagFilterUI(); return; }
    var gid = String(state.group || '');
    tagFilter.group = (gid && TAG_INDEX.groups.some(function(x) { return x.id === gid; })) ? gid : '';
    var ids = (state.tags || []).map(String).filter(function(id) { return !!tagById(id); });
    tagFilter.tags = ids.filter(function(id, i) { return ids.indexOf(id) === i; });
    renderTagFilterUI();
    if (tagFilterActive()) { currentPage = 1; render(); syncUrlState(); }
  };

  // 组下拉：切换后标签多选列表按组级联（已选标签保留 —— 不因切换组静默丢筛选）
  window.setTagGroup = function(gid) {
    tagFilter.group = gid || '';
    persistTagFilter();
    renderTagFilterUI();
    currentPage = 1;
    render();
    syncUrlState();
  };

  window.toggleTagFilterId = function(id) {
    id = String(id || '');
    if (!id) return;
    var i = tagFilter.tags.indexOf(id);
    if (i === -1) tagFilter.tags.push(id); else tagFilter.tags.splice(i, 1);
    persistTagFilter();
    renderTagFilterUI();
    currentPage = 1;
    render();
    syncUrlState();
  };

  window.clearTagFilter = function() {
    tagFilter = {group: '', tags: []};
    persistTagFilter();
    renderTagFilterUI();
    currentPage = 1;
    render();
    syncUrlState();
  };

  window.toggleTagFilterDropdown = function(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    var dd = document.getElementById('tagDropdown');
    if (!dd) return;
    dd.classList.toggle('show');
  };

  // 筛选条渲染：无任何标签 → 整条隐藏（缺 tags 字段的降级态）
  function renderTagFilterUI() {
    var bar = document.getElementById('tagFilterBar');
    if (!bar) return;
    if (!TAG_INDEX.tags.length) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
    bar.style.display = 'flex';
    var gsel = document.getElementById('tagGroupSelect');
    if (gsel) {
      var opts = ['<option value="">全部组</option>'];
      TAG_INDEX.groups.forEach(function(g) {
        opts.push('<option value="' + escapeHtml(g.id) + '">' + escapeHtml(g.display_name) + '</option>');
      });
      gsel.innerHTML = opts.join('');
      gsel.value = tagFilter.group;
    }
    // 级联：选组后仅列该组标签；组内无标签（taxonomy 缺组信息）→ 回退全量，不出现空下拉
    var listTags = TAG_INDEX.tags.filter(function(t) { return !tagFilter.group || t.group_id === tagFilter.group; });
    if (!listTags.length) listTags = TAG_INDEX.tags;
    var dd = document.getElementById('tagDropdown');
    if (dd) {
      dd.innerHTML = listTags.map(function(t) {
        var on = tagFilter.tags.indexOf(t.id) !== -1;
        return '<label class="tf-opt"><input type="checkbox"' + (on ? ' checked' : '') +
          ' onchange="toggleTagFilterId(\'' + escapeAttr(t.id) + '\')">' +
          '<span>' + escapeHtml(t.display_name) + '</span>' +
          ((t.group_id && !tagFilter.group) ? '<span class="tf-opt-group">' + escapeHtml(groupDisplay(t.group_id)) + '</span>' : '') +
          '</label>';
      }).join('');
    }
    var btn = document.getElementById('tagMultiBtn');
    if (btn) {
      btn.innerHTML = '🏷 选择标签' + (tagFilter.tags.length ? ' <span class="tf-count">' + tagFilter.tags.length + '</span>' : '') +
        ' <span class="tf-caret">▾</span>';
    }
    var chips = document.getElementById('tagChips');
    if (chips) {
      var parts = [];
      if (tagFilter.group) {
        parts.push('<span class="tf-chip" title="标签组：组内并集">组: ' + escapeHtml(groupDisplay(tagFilter.group)) +
          '<span class="tf-x" onclick="event.stopPropagation();setTagGroup(\'\')">✕</span></span>');
      }
      tagFilter.tags.forEach(function(id) {
        parts.push('<span class="tf-chip" title="已选标签：多标签取交集">' + escapeHtml(tagDisplay(id)) +
          '<span class="tf-x" onclick="event.stopPropagation();toggleTagFilterId(\'' + escapeAttr(id) + '\')">✕</span></span>');
      });
      chips.innerHTML = parts.join('');
    }
    var clr = document.getElementById('tagClearBtn');
    if (clr) clr.style.display = tagFilterActive() ? 'inline-flex' : 'none';
  }

  // 点空白关闭标签多选下拉
  document.addEventListener('click', function(e) {
    var dd = document.getElementById('tagDropdown');
    if (!dd || !dd.classList.contains('show')) return;
    var wrap = document.querySelector('.tf-multi-wrap');
    if (wrap && wrap.contains(e.target)) return;
    dd.classList.remove('show');
  });

  /* ── Render ── */
  function render() {
    applyFilters();
    if (!sortKey && TABS && TABS.length) {
      // Default sort: keep original order within tab
    }
    updateStats();
    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageData = filtered.slice(start, start + PAGE_SIZE);

    var emptyEl = document.getElementById('emptyState');
    if (filtered.length === 0) { emptyEl.style.display = 'block'; }
    else { emptyEl.style.display = 'none'; }

    var tbody = document.getElementById('tbody');
    if (!pageData.length) { tbody.innerHTML = ''; renderPager(totalPages); return; }

    var cols = visibleCols();
    // 第 1 个可见非 actions 列 (用于默认分栏)
    var firstKeyCol = cols.find(function(c) { return c.type !== 'actions'; });
    var frozenOffsets = [];
    var fo = 0;
    cols.forEach(function(c) { frozenOffsets.push(c.freeze ? ' style="left:' + fo + 'px"' : ''); if (c.freeze) fo += 120; });

    tbody.innerHTML = pageData.map(function(row, pi) {
      var rowIdx = start + pi;
      var rowClass = [];
      if (selectedRows[rowIdx]) rowClass.push('selected');
      if (isRowClickable(row)) rowClass.push('clickable');
      var rowHtml = '<tr class="'+rowClass.join(' ')+'"'+(isRowClickable(row)?' onclick="handleRowClick('+rowIdx+')"':'')+'>';
      if (showRowSelect) {
        rowHtml += '<td class="col-checkbox"><input type="checkbox" '+(selectedRows[rowIdx]?'checked':'')+' onclick="event.stopPropagation();toggleRow('+rowIdx+')"></td>';
      }
      if (showIndex) {
        rowHtml += '<td class="col-index-num">' + (rowIdx + 1) + '</td>';
      }
      cols.forEach(function(col) {
        if (col.type === 'actions') {
          var stickyCls2 = col.stickyRight ? ' sticky-right' : '';
          rowHtml += '<td style="white-space:nowrap" class="'+stickyCls2.trim()+'">'+renderActions(col, row)+'</td>';
        } else {
          var val = row[col.key];
          if (col.type === 'pills') {
              var items = (val || '').toString().split(/[,，、/]+/).map(function(s){return s.trim();}).filter(Boolean);
              // pillFilter 默认开: 标签点击筛选, pillFilter: false 可关闭
              var pillsHtml = items.map(function(s){
                return '<span class="cell-pill'+(col.pillFilter !== false ? ' pill-clickable' : '')+'"'+
                  (col.pillFilter !== false ? ' onclick="event.stopPropagation();quickFilterBy(\''+escapeAttr(col.key)+'\',\''+escapeAttr(s)+'\',\'contains\')"' : '')+
                  '>'+escapeHtml(s)+'</span>';
              }).join('');
              var freezeCls = col.freeze ? ' frozen-col' : '';
              var stickyCls = col.stickyRight ? ' sticky-right' : '';
              var freezeStyle = frozenOffsets[cols.indexOf(col)] || '';
              // pills 列整格点击：onCellClick:'split' 时打开分栏（pill 标签点击仍为筛选，stopPropagation 隔离）
              // CL009: 携带列 key，反馈链接可预填 field
              var pillsKey = JSON.stringify(col.key).replace(/"/g, '&quot;');
              var pillsTdOnclick = col.onCellClick === 'split' ? ' onclick="event.stopPropagation();openSplitAt('+rowIdx+','+pillsKey+')"' : '';
              rowHtml += '<td class="clickable-cell cell-pills'+(col.class?' '+col.class:'')+freezeCls+stickyCls+'"'+pillsTdOnclick+freezeStyle+'>'+pillsHtml+'</td>';
              return;
            }
            if (col.type === 'tags') {
              // CL036 标签列：契约 tags:[{id,display_name}]（兼容字符串数组/顿号串）
              //  col.tagClick=true → 点 pill = 切换标签筛选（stopPropagation 隔离行/格点击）
              var tagArr = Array.isArray(val) ? val : normalizeTagArray(val);
              var tagFreeze = col.freeze ? ' frozen-col' : '';
              var tagSticky = col.stickyRight ? ' sticky-right' : '';
              var tagStyle = frozenOffsets[cols.indexOf(col)] || '';
              var tagHtml = tagArr.map(function(t) {
                var name = pillText(t);
                if (!name) return '';
                if (col.tagClick) {
                  return '<span class="cell-pill pill-clickable" title="按标签筛选：' + escapeHtml(name) + '"' +
                    ' onclick="event.stopPropagation();toggleTagFilterId(\'' + escapeAttr(tagIdOf(t)) + '\')">' +
                    escapeHtml(name) + '</span>';
                }
                return '<span class="cell-pill">' + escapeHtml(name) + '</span>';
              }).join('');
              rowHtml += '<td class="clickable-cell cell-pills' + (col.class ? ' ' + col.class : '') + tagFreeze + tagSticky + '"' +
                ' onclick="event.stopPropagation();openSplitAt(' + rowIdx + ',' + JSON.stringify(col.key).replace(/"/g, '&quot;') + ')"' +
                tagStyle + '>' + tagHtml + '</td>';
              return;
            }
            if (col.type === 'list') {
              // CL036 关联列：条目数（千分位）+ 整格点击分栏列详情；计数缺省回退 col.countKey
              var listArr = Array.isArray(val) ? val : [];
              var listCnt = listArr.length;
              if (!listCnt && col.countKey) listCnt = parseInt(row[col.countKey], 10) || 0;
              var listFreeze = col.freeze ? ' frozen-col' : '';
              var listSticky = col.stickyRight ? ' sticky-right' : '';
              var listStyle = frozenOffsets[cols.indexOf(col)] || '';
              var cntCls = listCnt > 0 ? 'cell-pill pill-clickable' : 'cell-pill cell-pill-empty';
              rowHtml += '<td class="clickable-cell cell-pills' + (col.class ? ' ' + col.class : '') + listFreeze + listSticky + '"' +
                ' title="' + (listCnt > 0 ? '点击分栏查看关联条目' : '无关联条目') + '"' +
                ' onclick="event.stopPropagation();openSplitAt(' + rowIdx + ',' + JSON.stringify(col.key).replace(/"/g, '&quot;') + ')"' +
                listStyle + '><span class="' + cntCls + '">' + Number(listCnt).toLocaleString('en-US') + '</span></td>';
              return;
            }
            if (col.type === 'videos') {
              // 视频列：每视频一个 pill [图标] title (duration)；maxShow 折叠 "+N"，点击展开全部（不折叠回，re-render 重置）
              var videos = val;
              var vMaxShow = (col.videos && typeof col.videos.maxShow === 'number') ? col.videos.maxShow : 3;
              var vCount = Array.isArray(videos) ? videos.length : 0;
              var vVisible = Math.min(vCount, vMaxShow);
              var vHtml = '';
              for (var vi = 0; vi < vVisible; vi++) vHtml += renderVideoPill(videos[vi]);
              var vRestHtml = '';
              if (vCount > vVisible) {
                vRestHtml = '<span class="video-rest" style="display:none">';
                for (var vj = vVisible; vj < vCount; vj++) vRestHtml += renderVideoPill(videos[vj]);
                vRestHtml += '</span>';
              }
              var vMoreHtml = vCount > vVisible ? '<span class="video-pill video-more" onclick="event.stopPropagation();expandVideos(this)" title="展开全部">+' + (vCount - vVisible) + '</span>' : '';
              var freezeClsV = col.freeze ? ' frozen-col' : '';
              var stickyClsV = col.stickyRight ? ' sticky-right' : '';
              var freezeStyleV = frozenOffsets[cols.indexOf(col)] || '';
              rowHtml += '<td class="clickable-cell cell-pills'+(col.class?' '+col.class:'')+freezeClsV+stickyClsV+'"'+freezeStyleV+'>'+vHtml+vRestHtml+vMoreHtml+'</td>';
              return;
            }
            if (col.render) val = col.render(val, row);
          else if (col.format === 'thousands' && typeof val === 'number') val = val.toLocaleString('en-US');
          else if (col.escape === false) { /* 显式豁免: raw HTML（如 <a> 链接列） */ }
          else if (val === undefined || val === null) val = '';
          else val = escapeHtml(String(val));  // HG-SEC-134: 默认转义，防止 stored XSS
          var freezeCls = col.freeze ? ' frozen-col' : '';
          var stickyCls = col.stickyRight ? ' sticky-right' : '';
          var freezeStyle = frozenOffsets[cols.indexOf(col)] || '';
          var qfKey = JSON.stringify(col.key).replace(/"/g, '&quot;');
          var qfVal = JSON.stringify(String(row[col.key]||'')).replace(/"/g, '&quot;');
          var tdOnclick = '';
          if (col.onCellClick === 'split') {
            tdOnclick = ' onclick="event.stopPropagation();openSplitAt('+rowIdx+','+qfKey+')"';  // CL009: 携带列 key
          } else if (col.quickFilter === true) {
            // quickFilter 默认关: col.quickFilter === true 才启用单元格点击筛选
            tdOnclick = ' onclick="event.stopPropagation();quickFilterBy('+qfKey+','+qfVal+')"';
          } else if (col === firstKeyCol) {
            // 第 1 列默认分栏: 无其他 onclick handler 时打开 split
            tdOnclick = ' onclick="event.stopPropagation();openSplitAt('+rowIdx+','+qfKey+')"';  // CL009: 携带列 key
          }
          rowHtml += '<td class="clickable-cell' + (col.class ? ' ' + col.class : '') + freezeCls + stickyCls + '"'+tdOnclick+freezeStyle+'>'+val+'</td>';
        }
      });
      rowHtml += '</tr>';
      // Expand detail row (accordion mode)
      if (expandedIdx === rowIdx) {
        var detailCols = COLUMNS.filter(function(c) { return c.key && c.type !== 'actions' && colVisibility[c.key] !== false; });
        rowHtml += '<tr class="expand-row"><td colspan="' + (showRowSelect ? cols.length + 1 : cols.length) + '">';
        rowHtml += '<div class="expand-grid">';
        detailCols.forEach(function(c) {
          var v = row[c.key]; if (v === null || v === undefined) v = '';
          var valHtml;
          if (Array.isArray(v) && c.type === 'videos') {
            // videos 数组特判：逐条渲染 [图标] title (duration) + url 链接（勿 String(v) → [object Object]）
            valHtml = renderVideoListHtml(v);
          } else if (Array.isArray(v) && c.type === 'list') {
            valHtml = renderRelatedListHtml(v, c);          // CL036 关联列：逐条列 url/主字段/次字段
          } else {
            valHtml = escapeHtml(cellText(v));               // CL036: 数组/对象值 → 展示文本
          }
          rowHtml += '<div class="expand-item"><div class="ex-label">' + escapeHtml(c.label) + '</div><div class="ex-value">' + valHtml + '</div></div>';
        });
        rowHtml += '</div></td></tr>';
      }
      return rowHtml;
    }).join('');
    renderPager(totalPages);
  }

  function renderActions(col, row) {
    if (!col.actions) return '';
    return col.actions.map(function(act) {
      var onclick = '';
      if (act.copyKey) {
        onclick = 'event.stopPropagation();copyAction(' + JSON.stringify(row[act.copyKey] || '') + ')';
      } else if (act.hrefKey) {
        onclick = 'event.stopPropagation();window.open(' + JSON.stringify(row[act.hrefKey] || '').replace(/"/g, '&quot;') + ',"_blank","noopener,noreferrer")';
      } else if (act.handler) {
        onclick = 'event.stopPropagation();window.' + act.handler + '(event,' + JSON.stringify(row).replace(/\"/g, '&quot;') + ')';
      } else if (act.desc) {
        onclick = 'event.stopPropagation();showDemoAction(' + JSON.stringify((act.icon||'') + ' ' + act.label + ': ' + act.desc) + ')';
      }
      return '<button class="action-btn ' + (act.class||'') + '" onclick=\'' + onclick + '\' title="' + (act.label||'') + '">' + (act.icon || act.label) + '</button>';
    }).join('');
  }

  /* ── Demo action: show description toast ── */
  window.showDemoAction = function(msg) {
    showToast(msg);
  };

  function escapeAttr(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

  /* ── Videos column (col.type === 'videos') ── */
  // 平台图标映射：归一化 String(platform).trim().toLowerCase() 后匹配别名（抖音→douyin、B站→bilibili、YouTube→youtube）
  var VIDEO_PLATFORM_ICONS = {
    'douyin': '🎵', '抖音': '🎵',
    'bilibili': '📺', 'b站': '📺',
    'youtube': '▶️'
  };
  function videoPlatformIcon(platform) {
    var p = String(platform === undefined || platform === null ? '' : platform).trim().toLowerCase();
    return VIDEO_PLATFORM_ICONS[p] || '📹';
  }
  // pill 文案：[图标] title (duration)；title 缺省 → [图标] platform (duration)；均缺省 → [📹] (duration)
  function videoPillLabel(v) {
    var icon = videoPlatformIcon(v.platform);
    var dur = v.duration ? ' (' + v.duration + ')' : '';
    if (v.title) return icon + ' ' + v.title + dur;
    if (v.platform) return icon + ' ' + String(v.platform) + dur;
    return icon + dur;
  }
  // 单元格视频 pill：点击新标签页打开 url（noopener,noreferrer；onclick 转义沿用 actions 先例 JSON.stringify + &quot;）
  function renderVideoPill(v) {
    if (!v || typeof v !== 'object') return '';
    var url = v.url;
    if (url === undefined || url === null) return '';
    var label = videoPillLabel(v);
    var urlAttr = JSON.stringify(String(url)).replace(/\"/g, '&quot;');
    return '<span class="video-pill" title="' + escapeHtml(String(url)) + '" onclick="event.stopPropagation();window.open(' + urlAttr + ',\'_blank\',\'noopener,noreferrer\')">' + escapeHtml(label) + '</span>';
  }
  // 折叠 "+N"：点击展开全部（DOM 显示剩余 pill），不折叠回；跨 re-render 重置折叠态
  window.expandVideos = function(el) {
    var td = el.parentNode;
    var rest = td.querySelector('.video-rest');
    if (rest) rest.style.display = '';
    el.style.display = 'none';
  };
  // split 预览 / expand 行内展开：markdown 链接风格 [图标 title (duration)] —— label 为链接文本（点击打开 url），url 仅 hover title 可见
  function renderVideoListHtml(videos) {
    if (!Array.isArray(videos) || !videos.length) return '';
    return videos.map(function(v) {
      if (!v || typeof v !== 'object') return '';
      var url = v.url;
      var label = videoPillLabel(v);
      if (url) {
        var urlAttr = JSON.stringify(String(url)).replace(/\"/g, '&quot;');
        return '<div style="margin:2px 0;line-height:1.6">' +
          '<a class="video-split-link" href="javascript:void(0)" title="' + escapeHtml(String(url)) + '" onclick="event.stopPropagation();window.open(' + urlAttr + ',\'_blank\',\'noopener,noreferrer\')">' + escapeHtml(label) + '</a></div>';
      }
      return '<div style="margin:2px 0;line-height:1.6">' + escapeHtml(label) + '</div>';
    }).join('');
  }

  /* ── CL036 关联条目列表（分栏详情 / 行内展开 / modal 共用）：逐条 url + 主字段 + 次字段 ── */
  function renderRelatedListHtml(items, col) {
    if (!Array.isArray(items) || !items.length) return '<span style="color:var(--text-muted)">（无）</span>';
    var mainKey = (col && col.listLabel) || '';
    var subKey = (col && col.listSub) || '';
    return items.map(function(it) {
      if (!it || typeof it !== 'object') {
        return '<div style="margin:3px 0;line-height:1.7">' + escapeHtml(pillText(it)) + '</div>';
      }
      var main = (mainKey && it[mainKey]) ? String(it[mainKey]) : pillText(it);
      var sub = '';
      var sv = subKey ? it[subKey] : undefined;
      if (typeof sv === 'boolean') { if (sv) sub = '✅'; }
      else if (sv !== undefined && sv !== null && sv !== '') { sub = String(sv); }
      else if (it.platform) { sub = String(it.platform); }
      var link = '';
      if (it.url) {
        link = '<a class="related-link" href="javascript:void(0)" title="' + escapeHtml(String(it.url)) + '"' +
          ' onclick="event.stopPropagation();window.open(' + JSON.stringify(String(it.url)).replace(/"/g, '&quot;') +
          ',\'_blank\',\'noopener,noreferrer\')">🔗</a> ';
      }
      return '<div style="margin:3px 0;line-height:1.7">' + link + escapeHtml(main) +
        (sub ? ' <span style="color:var(--text-muted)">· ' + escapeHtml(sub) + '</span>' : '') + '</div>';
    }).join('');
  }

  function getRowClickCol() {
    return COLUMNS.find(function(c){return c.onClick;});
  }

  function isRowClickable(row) {
    if (clickMode === 'tab') {
      var col = getRowClickCol();
      return col && col.onClick === 'url' && row.url;
    }
    // modal, split, or expand: any row is clickable
    return clickMode === 'modal' || clickMode === 'split' || clickMode === 'expand';
  }

  /* ── Stats ── */
  function updateStats() {
    document.getElementById('statTotal').textContent = DATA.length;
    var fp = document.getElementById('statFilteredPill');
    if (filtered.length !== DATA.length || quickFilter) {
      fp.style.display = 'inline-flex';
      document.getElementById('statFiltered').textContent = filtered.length;
    } else { fp.style.display = 'none'; }
    var sp = document.getElementById('statSelectedPill');
    if (showRowSelect) {
      var cnt = Object.keys(selectedRows).length;
      sp.style.display = cnt > 0 ? 'inline-flex' : 'none';
      document.getElementById('statSelected').textContent = cnt;
    }
    // Quick filter pill
    var qfEl = document.getElementById('quickFilterPill');
    if (quickFilter) {
      qfEl.style.display = 'inline-flex';
      var col = COLUMNS.find(function(c){return c.key===quickFilter.key;});
      qfEl.innerHTML = (col ? col.label : quickFilter.key) + ': ' + escapeHtml(quickFilter.value) + '<span class="fp-close" onclick="event.stopPropagation();clearQuickFilter()">✕</span>';
      qfEl.onclick = function() { clearQuickFilter(); };
    } else {
      qfEl.style.display = 'none';
    }
  }

  window.quickFilterBy = function(key, value, mode) {
    if (splitActive) closeSplit();  // HG-SEC-075: quickFilter 设置/清除 → 关闭分栏 (split 下标仅对默认排序+无 quickFilter 有效)
    mode = mode || 'exact';
    if (quickFilter && quickFilter.key === key && quickFilter.value === value && (quickFilter.mode || 'exact') === mode) {
      quickFilter = null;  // toggle off
    } else {
      quickFilter = {key: key, value: value, mode: mode};
    }
    expandedIdx = -1;
    currentPage = 1;
    render();
  };

  window.clearQuickFilter = function() {
    if (splitActive) closeSplit();  // HG-SEC-075
    quickFilter = null;
    currentPage = 1;
    render();
  };

  /* ── Pagination ── */
  function renderPager(totalPages) {
    var el = document.getElementById('pager');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    var h = '<button class="btn btn-ghost btn-sm" onclick="goPage(1)"'+(currentPage===1?' disabled':'')+'>‹‹</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+(currentPage-1)+')"'+(currentPage===1?' disabled':'')+'>‹</button>';
    h += '<span class="text-xs text-gray" style="margin:0 8px;">'+currentPage+' / '+totalPages+'</span>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+(currentPage+1)+')"'+(currentPage===totalPages?' disabled':'')+'>›</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+totalPages+')\"'+(currentPage===totalPages?' disabled':'')+'>››</button>';
    el.innerHTML = h;
  }

  window.goPage = function(n) {
    var tp = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.max(1, Math.min(n, tp));
    expandedIdx = -1;
    render();
  };

  /* ── Sort ── */
  function initThead() {
    var thead = document.getElementById('thead');
    var cols = visibleCols();
    // Ensure every column has an explicit width (Cinema-disciplined model)
    cols.forEach(function(c) {
      if (!c.width) c.width = c.type === 'actions' ? '100px' : '120px';
    });
    var frozenOffset = 0;
    var frozenStyles = [];
    cols.forEach(function(c) {
      var w = c.width ? parseInt(c.width) : 120;
      if (c.freeze) { frozenStyles.push('left:' + frozenOffset + 'px'); frozenOffset += w; }
      else { frozenStyles.push(''); }
    });
    thead.innerHTML = '<tr>' +
      (showIndex ? '<th class="col-index-num" style="width:42px">序号</th>' : '') +
      (showRowSelect ? '<th class="col-checkbox"><input type="checkbox" id="selectAll" onchange="toggleAll(event)"></th>' : '') +
      cols.map(function(c, ci) {
        var sortCls = '';
        if (c.sortable !== false && c.type !== 'actions') { sortCls = ' sortable'; if (sortKey === c.key) sortCls += sortAsc ? ' sort-asc' : ' sort-desc'; if (sortKey2 === c.key) sortCls += ' sort-asc'; }
        var freezeCls = c.freeze ? ' frozen-col' : '';
        var stickyCls = c.stickyRight ? ' sticky-right' : '';

  function syncUrlState() {
    var p = new URLSearchParams();
    if (TABS && TABS.length && activeTab && activeTab !== TABS[0].key) p.set('tab', activeTab);
    var q = document.getElementById('searchInput').value;
    if (q) p.set('q', q);
    if (splitActive && splitIdx >= 0) p.set('split', String(splitIdx));
    // CL036 标签筛选进 URL（可分享/可刷新保持）：组用 tagGroup，多标签用重复 tag 参数
    if (tagFilter.group) p.set('tagGroup', tagFilter.group);
    tagFilter.tags.forEach(function(id) { p.append('tag', id); });
    // 页面级扩展：range（本地过滤，range tabs 在 runtime 之外）也纳入 URL 状态

    if (window.w2mRange && window.w2mRange !== RANGE_DEFAULT) p.set('range', window.w2mRange);
    var qs = p.toString();
    var url = location.pathname + (qs ? '?' + qs : '');
    try { history.replaceState(null, '', url); } catch(e) {}
  }

  /* ── CL009: GitHub Issue 反馈链接（Issue Form 预填，全部 encodeURIComponent） ── */
  function buildFeedbackUrl(row) {
    if (!FB_REPO || !row) return '';
    var keyField = (FB_CFG && FB_CFG.key) || 'name';
    var altField = (FB_CFG && FB_CFG.altKey) || '';
    var rowId = (row[keyField] === null || row[keyField] === undefined) ? '' : String(row[keyField]);
    if (!rowId) return '';
    var parts = [];
    function add(k, v) {
      if (v === null || v === undefined) return;
      v = String(v);
      if (!v) return;
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    }
    // v1.3 (CL009): 模板名来自 options.feedback.template（案例自描述）
    add('template', (FB_CFG && FB_CFG.template) || 'data-fix.yml');
    var bits = [];
    if (FB_CFG && FB_CFG.dataset) bits.push(String(FB_CFG.dataset));
    bits.push(rowId);
    add('title', '[数据反馈] ' + bits.join(' · '));
    add('page', (location.pathname || '').replace(/^\/+/, ''));
    add('dataset', FB_CFG && FB_CFG.dataset);
    add('row', rowId);
    add('row_en', altField ? row[altField] : '');
    // v1.3 (D1): 不再预填 field / current —— 字段由表单下拉选择（dropdown 不可 URL 预填）
    return 'https://github.com/' + FB_REPO + '/issues/new?' + parts.join('&');
  }
  window.buildFeedbackUrl = buildFeedbackUrl;
  window.openFeedbackIssue = function() {
    var url = buildFeedbackUrl(splitRow);

  /* ── Split drag ── */
  function initSplitDrag() {
    var drag = document.getElementById('splitDrag');
    var wrapper = document.querySelector('.wrapper');
    var isDragging = false;

    drag.addEventListener('mousedown', function(e) {
      e.preventDefault();
      isDragging = true;
      drag.classList.add('active');
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', onDragEnd);
    });

    function onDrag(e) {
      if (!isDragging) return;
      var rect = wrapper.getBoundingClientRect();
      var ratio = ((e.clientX - rect.left) / rect.width) * 100;
      ratio = Math.max(25, Math.min(75, ratio));
      splitRatio = ratio;
      wrapper.style.setProperty('--spl-ratio', ratio+'%');
      try { localStorage.setItem('web2md:table:split-ratio', ratio); } catch(e) {}
    }

    function onDragEnd() {
      isDragging = false;
      drag.classList.remove('active');
      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('mouseup', onDragEnd);
    }
  }

    var hasModal = validModes.indexOf('modal') !== -1;

    var tabCount = (hasSplit ? 1 : 0) + (hasModal ? 1 : 0) + (hasExpand ? 1 : 0) + 1;

    // click mode section
    if (tabCount > 1) {
      html += '<div class="col-toggle-divider"></div><div class="settings-section">点击模式</div>';
      if (validModes.indexOf('tab') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="tab" '+(clickMode==='tab'?'checked':'')+' onchange="setClickMode(\'tab\')">🔗 新标签页</label>';
      if (validModes.indexOf('modal') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="modal" '+(clickMode==='modal'?'checked':'')+' onchange="setClickMode(\'modal\')">📋 弹出面板</label>';
      if (validModes.indexOf('split') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="split" '+(clickMode==='split'?'checked':'')+' onchange="setClickMode(\'split\')">📑 分栏预览</label>';
      if (validModes.indexOf('expand') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="expand" '+(clickMode==='expand'?'checked':'')+' onchange="setClickMode(\'expand\')">📂 行内展开</label>';

    // column visibility
    html += '<div class="col-toggle-divider"></div>';

    html += COLUMNS.filter(function(c){return c.key && c.type !== 'actions';}).map(function(c) {
      var visible = colVisibility[c.key] !== false;

  /* ── Column resize ── */
  var COL_WIDTHS_KEY = 'web2md:table:col-widths';
  var _resizeCol, _resizeStartX, _resizeStartW, _resizeTh;
  window.startResize = function(e, key) {
    e.stopPropagation(); e.preventDefault();
    _resizeCol = key;
    _resizeStartX = e.clientX;
    _resizeTh = e.target.parentElement;
    _resizeStartW = _resizeTh.offsetWidth;
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('mouseup', onResizeUp);
  };
  function onResizeMove(e) {
    if (!_resizeCol) return;
    var delta = e.clientX - _resizeStartX;
    var newW = Math.max(40, _resizeStartW + delta);
    // Direct DOM update (no full thead rebuild — avoids flicker)
    if (_resizeTh) _resizeTh.style.width = newW + 'px';
  }
  function onResizeUp() {
    if (_resizeCol && _resizeTh) {
      var newW = _resizeTh.offsetWidth;
      var col = COLUMNS.find(function(c){return c.key===_resizeCol;});
      if (col) col.width = newW + 'px';
      // Persist to localStorage
      try {
        var saved = {};
        COLUMNS.forEach(function(c) { if (c.width) saved[c.key] = c.width; });
        localStorage.setItem(COL_WIDTHS_KEY, JSON.stringify(saved));
      } catch(e) {}
    }
    _resizeCol = null;
    _resizeTh = null;
    document.removeEventListener('mousemove', onResizeMove);
    document.removeEventListener('mouseup', onResizeUp);
  }

  /* ── Init ── */
  function init() {
    // CL004: URL 状态恢复 — 顺序 tab(buildTabs 前) → q(render 前) → split(render 后) (HG-SEC-076)
    var _params = new URLSearchParams(location.search);
    var _urlTab = _params.get('tab');
    if (_urlTab && TABS && TABS.find(function(t){ return t.key === _urlTab; })) {
      activeTab = _urlTab;  // 白名单校验, 无效忽略

    var _urlQ = _params.get('q');

      document.getElementById('searchInput').value = _urlQ;
    }
    var _urlSplit = _params.get('split');
    // Restore saved column widths
    try {
      var savedWidths = localStorage.getItem(COL_WIDTHS_KEY);
      if (savedWidths) {
        var wmap = JSON.parse(savedWidths);
        COLUMNS.forEach(function(c) { if (wmap[c.key]) c.width = wmap[c.key]; });

  /* ═══════════════════════════════════════════

  var quickSearch = {
    overlay: document.getElementById('qsOverlay'),
    input: document.getElementById('qsInput'),
    active: false,

    open: function() {
      if (!showSearch) return;
      // Copy current header search value to popup
      this.input.value = document.getElementById('searchInput').value;
      this.overlay.classList.add('active');
      this.active = true;
      this.updateMatchCount();
      setTimeout(function() { quickSearch.input.focus(); quickSearch.input.select(); }, 80);
    },

    close: function() {
      // Sync popup value back to header (don't trigger search)
      document.getElementById('searchInput').value = this.input.value;
      this.overlay.classList.remove('active');
      this.active = false;
    },

    submit: function() {
      // Sync + trigger search
      document.getElementById('searchInput').value = this.input.value;
      this.overlay.classList.remove('active');
      this.active = false;
      currentPage = 1;
      render();
      syncUrlState();
    },

    updateMatchCount: function() {
      var el = document.getElementById('qsMatchCount');
      if (!el) return;
      var q = this.input.value.toLowerCase().trim();
      if (!q) { el.textContent = ''; return; }
      var cnt = DATA.filter(function(row) {
        return COLUMNS.some(function(col) {
          if (col.type === 'actions') return false;
          return cellText(row[col.key]).toLowerCase().indexOf(q) !== -1;
        });
      }).length;
      el.textContent = '匹配 ' + cnt + ' 条';
    }
  };

  // Input: live match count update (no header sync)

  document.addEventListener('keydown', function(e) {
    // Cmd+F / Ctrl+F
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      if (!showSearch) return;
      e.preventDefault();
      quickSearch.open();
    }
    // Esc when overlay active
    if (e.key === 'Escape' && quickSearch.active) {
      quickSearch.close();
    }
  });

  /* ── Keyboard Navigation ── */
  var kbFocusIdx = -1;
  document.addEventListener('keydown', function(e) {
    // Only when not in input
    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
    var tbody = document.getElementById('tbody');
    var rows = tbody.querySelectorAll('tr:not(.expand-row)');
    if (!rows.length) return;
    var pageRows = rows.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); kbFocusIdx = kbFocusIdx < 0 ? 0 : Math.min(pageRows - 1, kbFocusIdx + 1); highlightKbRow(rows); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); kbFocusIdx = kbFocusIdx < 0 ? pageRows - 1 : Math.max(0, kbFocusIdx - 1); highlightKbRow(rows); }
    else if (e.key === 'Enter' && kbFocusIdx >= 0) { e.preventDefault(); var r = rows[kbFocusIdx]; if (r) r.click(); }
  });
  function highlightKbRow(rows) {
    rows.forEach(function(r, i) { r.classList.toggle('keyboard-focus', i === kbFocusIdx); });
    if (kbFocusIdx >= 0 && rows[kbFocusIdx]) rows[kbFocusIdx].scrollIntoView({block:'nearest'});

  /* ── View Presets ── */
  window.savePreset = function(name) {
    name = name || ('预设 ' + (new Date()).toLocaleTimeString());
    var presets = [];
    try { presets = JSON.parse(localStorage.getItem('web2md:table:presets')) || []; } catch(e) {}
    var state = {density: density, clickMode: clickMode, splitRatio: splitRatio, colVisibility: colVisibility, sortKey: sortKey, sortAsc: sortAsc, name: name};
    var json = JSON.stringify(state);
    if (json.length > MAX_PRESET_SIZE) { showToast('预设过大，请减少列数'); return; }
    var existing = presets.findIndex(function(p){ return p.name === name; });
    if (existing >= 0) presets[existing] = state;
    else { if (presets.length >= MAX_PRESETS) presets.shift(); presets.push(state); }
    try { localStorage.setItem('web2md:table:presets', JSON.stringify(presets)); } catch(e) { showToast('存储失败'); return; }
    showToast('已保存: ' + name);
  };
  window.loadPreset = function(name) {
    var presets = [];
    try { presets = JSON.parse(localStorage.getItem('web2md:table:presets')) || []; } catch(e) {}
    var p = presets.find(function(p){ return p.name === name; });
    if (!p) { showToast('预设不存在: ' + name); return; }
    if (p.density) { density = p.density; applyDensity(); }
    if (p.clickMode) { clickMode = p.clickMode; }
    if (p.splitRatio) { splitRatio = p.splitRatio; document.querySelector('.wrapper').style.setProperty('--spl-ratio', p.splitRatio+'%'); }
    if (p.colVisibility) { colVisibility = p.colVisibility; }
    if (p.sortKey) { sortKey = p.sortKey; sortAsc = p.sortAsc || true; }
    initColToggle(); initThead(); render();
    showToast('已加载: ' + name);
  };

     web2md 数据层（单通道：<script src="/web2md-data.js"> → window.WEB2MD_DATA）
     file:// 直开可用：不发 fetch、不依赖服务、无跨域；数据 js 缺失/形状不符 → 显式错误态（不给静默空表）

  var RANGE_KEY = 'web2md:table:range';
  var RANGE_VALUES = ['today', '7d', '30d', 'all'];
  var RANGE_DEFAULT = 'all';           // 本页默认「所有」（文章多为历史归档；today 常为空）
  var DATE_KEY = 'publish_date';       // range 下界比较字段（缺失回退 last_updated/timestamp/fetched_at）

  function w2mNormalizeRange(v) {
    return RANGE_VALUES.indexOf(v) !== -1 ? v : RANGE_DEFAULT;
  }

  // range 优先级：URL(?range=) > localStorage > 默认
  function w2mResolveRange() {
