var DATA = [{"slug": "train-map", "title": "高铁线路图", "group": "出行", "class": "D", "visibility": "masked", "aliases": "/12306.html", "description": "高铁车次全程线路图：途经站点、购票区间高亮、时刻表与座位信息，数据来自 Supabase 只读表。", "url": "/train-map.html"}, {"slug": "pmp-itto", "title": "PMP ITTO 知识图谱", "group": "学习", "class": "B", "visibility": "public", "aliases": "/pmp.html", "description": "PMP 十大知识领域 × 五大过程组 × 49 子过程的 ITTO 关系图谱，备考速查。", "url": "/pmp-itto.html"}, {"slug": "english-translator", "title": "英语句型翻译助手", "group": "学习", "class": "A", "visibility": "public", "aliases": "/translater.html", "description": "英语句型与时态转换对照工具，覆盖常见语法的正误示例。", "url": "/english-translator.html"}, {"slug": "brand-colors", "title": "品牌配色体系", "group": "设计", "class": "A", "visibility": "public", "aliases": "/palette.html", "description": "品牌色板与配色组合速查，含色值、对比度与使用场景建议。", "url": "/brand-colors.html"}, {"slug": "moments-cover", "title": "朋友圈封面生成器", "group": "设计", "class": "A", "visibility": "public", "aliases": "/cover.html", "description": "生成微信朋友圈封面图（1080×1800），可导出为 PNG 直接使用。", "url": "/moments-cover.html"}, {"slug": "daily-poetry", "title": "每日诗歌", "group": "生活", "class": "B", "visibility": "public", "aliases": "/poetry.html", "description": "每日一首诗：原文、注释与赏析，随构建快照发布。", "url": "/daily-poetry.html"}, {"slug": "git-cloner", "title": "Git 仓库克隆器", "group": "开发", "class": "D", "visibility": "public", "aliases": "/cloner.html", "description": "本地仓库克隆台账：列表、筛选、统计与 AI 摘要入口，支持 ?range=all 全量视图。", "url": "/git-cloner.html"}, {"slug": "web2md", "title": "微信文章转 Markdown", "group": "开发", "class": "D", "visibility": "public", "aliases": "—", "description": "微信文章转 Markdown 的本地台账：已处理清单、标签与关联计数、分栏原文预览。", "url": "/web2md.html"}, {"slug": "lock-screen", "title": "锁屏小组件示例", "group": "系统", "class": "C", "visibility": "public", "aliases": "/lockscreen.html", "description": "iOS 锁屏小组件（Scriptable）效果示例：时钟、天气与今日诗歌同屏演示。", "url": "/lock-screen.html"}];

(function () {
  var PAGE_SIZE = 30;
  var filtered = DATA.slice(), page = 1, sortKey = 'group', sortAsc = true;
  var COMPACT = (typeof COLUMNS_COMPACT !== 'undefined') ? COLUMNS_COMPACT : null;
  var DETAILS = (typeof DETAIL_DATA !== 'undefined') ? DETAIL_DATA : null;
  var MODE = 'browse', ACTIVE = '';

  function activeCols() { return (MODE === 'detail' && COMPACT) ? COMPACT : COLUMNS; }

  function iconBtn(symbol, href, title) {
    var a = document.createElement('a');
    a.className = 'icon-btn';
    a.href = href;
    a.title = title;
    a.setAttribute('aria-label', title);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = symbol;

  }

  function cell(row, col) {
    var td = document.createElement('td');
    if (col.wrap) td.className = 'wrap';
    if (col.ops) {
      td.className = 'ops-cell';
      if (row.kind === 'cli') {                     /* 工具无页面：只给「复制命令」 */

        cp.title = '复制命令 ' + (row.command || '');
        cp.onclick = function () {
          if (navigator.clipboard) navigator.clipboard.writeText(row.command || '');
          cp.textContent = '✓';
          setTimeout(function () { cp.textContent = '⧉'; }, 1200);
        };
        td.appendChild(cp);
        return td;
      }
      if (row.local) td.appendChild(iconBtn('🖥', row.local, '本地访问 ' + row.local));
      if (row.url) td.appendChild(iconBtn('🌐', row.url, '线上访问 ' + row.url));
      return td;
    }
    var raw = row[col.key];
    var val = (raw === undefined || raw === null) ? '' : String(raw);
    var sub = col.sub ? String(row[col.sub] || '') : '';
    var box = td;
    if (sub && sub !== '—') {
      box = kit('div', 'cell-stack');
      td.appendChild(box);
      td.title = val + ' · ' + sub;
    } else if (val) {
      td.title = val;           /* 截断列 hover 可见全文 */
    }
    if (col.link && row[col.link]) {
      var a = document.createElement('a');
      a.href = String(row[col.link]);
      a.textContent = val;
      if (col.key === 'title' && DETAILS) {
        a.className = 'td-title';
        a.addEventListener('click', function (ev) {
          if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return;   /* 中键/新窗口照常打开 */

          if (MODE === 'detail' && ACTIVE === row.slug) { collapse(); } else { selectDetail(row.slug); }
        });
      }
      box.appendChild(a);
    } else if (col.cls) {
      var s = document.createElement('span');
      s.className = (col.key === 'visibility' && val) ? 'vis vis-' + val.toLowerCase() : col.cls;
      s.textContent = val;
      box.appendChild(s);
    } else {
      box.appendChild(document.createTextNode(val));
    }
    if (sub && sub !== '—') box.appendChild(kit('span', 'cell-sub', sub));

  function rebuildHeader() {
    var thead = document.getElementById('thead');
    thead.innerHTML = '';
    var tr = document.createElement('tr');

      var th = document.createElement('th');

        th.classList.add('sortable');
        th.dataset.key = col.key;
        if (col.key === sortKey) th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
        th.onclick = function () { sortBy(col.key); };
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  function kit(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;

  function block(title) {
    var d = kit('div', 'detail-block');
    d.appendChild(kit('h3', '', title));

    var li = kit('li');
    parts.forEach(function (p) {
      if (p.tag) li.appendChild(kit('span', 'tag', p.tag));
      else if (p.code) li.appendChild(kit('code', '', p.code));
      else if (p.sub) li.appendChild(kit('span', 'sub', p.sub));
      else if (p.link) {
        var a = kit('a', '', p.text);
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener';
        li.appendChild(a);
      } else if (p.text !== undefined) li.appendChild(document.createTextNode(String(p.text)));

    return li;

  function renderDetail(slug) {

  function selectDetail(slug, silent) {
    if (!DETAILS || !DETAILS[slug]) return;
