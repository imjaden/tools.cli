(function () {
  var PAGE_SIZE = 30;
  var filtered = DATA.slice(), page = 1, sortKey = 'group', sortAsc = true;
  var COMPACT = (typeof COLUMNS_COMPACT !== 'undefined') ? COLUMNS_COMPACT : null;
  var DETAILS = (typeof DETAIL_DATA !== 'undefined') ? DETAIL_DATA : null;
  var MODE = 'browse', ACTIVE = '';
  var SITE = (typeof PAGE_MODE !== 'undefined' && PAGE_MODE === 'site');
  

  function activeCols() { return (MODE === 'detail' && COMPACT) ? COMPACT : COLUMNS; }

  function iconBtn(symbol, href, title) {
    var a = document.createElement('a');
    a.className = 'icon-btn';
    a.href = href;
    a.title = title;
    a.setAttribute('aria-label', title);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = symbol;
    return a;
  }

  function cell(row, col) {
    var td = document.createElement('td');
    if (col.wrap) td.className = 'wrap';
    if (col.ops) {
      td.className = 'ops-cell';
      if (row.kind === 'cli' && typeof opsCli === 'function') return opsCli(td, row);
      if (row.local) td.appendChild(iconBtn('🖥', row.local, '本地访问 ' + row.local));
      if (row.url) td.appendChild(iconBtn('🌐', row.url, '线上访问 ' + row.url));
      return td;
    }
    var raw = row[col.key];
    var val = (raw === undefined || raw === null) ? '' : String(raw);
    var sub = col.sub ? String(row[col.sub] || '') : '';
    var box = td;
    if (sub && sub !== '—') {
      box = kit('div', 'cell-stack');
      td.appendChild(box);
      td.title = val + ' · ' + sub;
    } else if (val) {
      td.title = val;           /* 截断列 hover 可见全文 */
    }
    if (col.link && row[col.link]) {
      var a = document.createElement('a');
      a.href = String(row[col.link]);
      a.textContent = val;
      if (col.key === 'title' && DETAILS) {
        a.className = 'td-title';
        a.addEventListener('click', function (ev) {
          if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return;   /* 中键/新窗口照常打开 */
          ev.preventDefault();
          if (MODE === 'detail' && ACTIVE === row.slug) { collapse(); } else { selectDetail(row.slug); }
        });
      }
      box.appendChild(a);
    } else if (col.cls) {
      var s = document.createElement('span');
      s.className = (col.key === 'visibility' && val) ? 'vis vis-' + val.toLowerCase() : col.cls;
      s.textContent = val;
      box.appendChild(s);
    } else {
      box.appendChild(document.createTextNode(val));
    }
    if (sub && sub !== '—') box.appendChild(kit('span', 'cell-sub', sub));
    return td;
  }

  function rebuildHeader() {
    var thead = document.getElementById('thead');
    thead.innerHTML = '';
    var tr = document.createElement('tr');
    activeCols().forEach(function (col) {
      var th = document.createElement('th');
      th.textContent = col.label;
      if (col.width) th.style.width = col.width;
      if (col.sortable !== false && !col.ops) {
        th.classList.add('sortable');
        th.dataset.key = col.key;
        if (col.key === sortKey) th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
        th.onclick = function () { sortBy(col.key); };
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  function kit(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function block(title) {
    var d = kit('div', 'detail-block');
    d.appendChild(kit('h3', '', title));
    return d;
  }

  function line(parts) {
    var li = kit('li');
    parts.forEach(function (p) {
      if (p.tag) li.appendChild(kit('span', 'tag', p.tag));
      else if (p.code) li.appendChild(kit('code', '', p.code));
      else if (p.sub) li.appendChild(kit('span', 'sub', p.sub));
      else if (p.link) {
        var a = kit('a', '', p.text);
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener';
        li.appendChild(a);
      } else if (p.text !== undefined) li.appendChild(document.createTextNode(String(p.text)));
    });
    return li;
  }

  

  function renderDetailSite(slug) {
    var d = DETAILS[slug];
    var pane = document.getElementById('detailPane');
    if (!d || !pane) return;
    pane.innerHTML = '';

    var head = kit('div', 'detail-head');
    head.appendChild(kit('h2', '', d.title));
    head.appendChild(kit('span', 'badge badge-blue', d.class + (d.class_label ? ' · ' + d.class_label : '')));
    head.appendChild(kit('span', 'badge badge-black', d.group));
    if (d.visibility_label) head.appendChild(kit('span', 'badge badge-black', d.visibility_label));
    var actions = kit('div', 'detail-actions');
    if (d.url) actions.appendChild(iconBtn('🌐', d.url, '打开 ' + d.url));
    var close = kit('button', 'detail-close', '← 列表');
    close.onclick = collapse;
    actions.appendChild(close);
    head.appendChild(actions);
    pane.appendChild(head);
    pane.appendChild(kit('div', 'kv', d.description || ''));

    var b1 = block('需求场景');
    b1.appendChild(kit('p', '', d.scenario || '（未填写）'));
    pane.appendChild(b1);

    var b2 = block('关联工具');
    var ul = kit('ul', 'link-list');
    (d.web || []).forEach(function (w) {
      ul.appendChild(line([{ tag: 'Web' }, { text: w.title + ' ' },
                           { link: w.url, text: w.self ? '（本页）' : w.url }]));
    });
    (d.cli || []).forEach(function (c) {
      ul.appendChild(line([{ tag: 'CLI' }, { code: (typeof c === 'string' ? c : c.name) }]));
    });
    (d.tm || []).forEach(function (t) {
      ul.appendChild(line([{ tag: 'TM' }, { text: (typeof t === 'string' ? t : t.name) }]));
    });
    if (!ul.children.length) ul.appendChild(line([{ text: '（无关联工具）' }]));
    b2.appendChild(ul);
    pane.appendChild(b2);

    var b3 = block('形态与可见性');
    var ul2 = kit('ul', 'link-list');
    ul2.appendChild(line([{ tag: '形态' }, { code: d.class }, { text: ' ' + (d.class_label || '') },
                          { sub: d.class_desc || '' }]));
    ul2.appendChild(line([{ tag: '可见性' }, { text: d.visibility_label || d.visibility }]));
    b3.appendChild(ul2);
    pane.appendChild(b3);

    var b4 = block('访问方式');
    var ul3 = kit('ul', 'link-list');
    var abs = (d.site || '') + d.slug + '.html';
    ul3.appendChild(line([{ tag: '线上' }, { link: abs, text: abs }]));
    (d.aliases || []).forEach(function (a) {
      ul3.appendChild(line([{ tag: '别名' }, { link: a, text: a }]));
    });
    ul3.appendChild(line([{ tag: '地址规范' }, { text: 'slug 即规范址；别名走静态跳转桩 → 规范址' }]));
    b4.appendChild(ul3);
    pane.appendChild(b4);
  }

  function renderDetail(slug) {
    return renderDetailSite(slug);
  }

  function selectDetail(slug, silent) {
    if (!DETAILS || !DETAILS[slug]) return;
    ACTIVE = slug;
    MODE = 'detail';
    var split = document.getElementById('split');
    if (split) split.setAttribute('data-mode', 'detail');
    rebuildHeader();
    render();
    renderDetail(slug);
    if (!silent && history.replaceState) history.replaceState(null, '', '#p=' + slug);
    var pane = document.getElementById('detailPane');
    if (pane && window.innerWidth < 1024 && pane.scrollIntoView) pane.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function collapse() {
    if (!DETAILS) return;
    ACTIVE = '';
    MODE = 'browse';
    var split = document.getElementById('split');
    if (split) split.setAttribute('data-mode', 'browse');
    rebuildHeader();
    render();
    if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);
  }

  function renderPager(total) {
    var el = document.getElementById('pager');
    el.innerHTML = '';
    if (total <= 1) return;
    document.getElementById('pager').appendChild(mkBtn('\u2039\u2039', 1, page === 1));
    el.appendChild(mkBtn('\u2039', page - 1, page === 1));
    var span = document.createElement('span');
    span.className = 'stat-label';
    span.style.margin = '0 8px';
    span.textContent = page + ' / ' + total;
    el.appendChild(span);
    el.appendChild(mkBtn('\u203a', page + 1, page === total));
    el.appendChild(mkBtn('\u203a\u203a', total, page === total));
  }

  function mkBtn(label, target, disabled) {
    var b = document.createElement('button');
    b.className = 'btn btn-ghost btn-sm';
    b.textContent = label;
    b.disabled = !!disabled;
    b.onclick = function () { page = target; render(); };
    return b;
  }

  function render() {
    var total = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (page > total) page = total;
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE).forEach(function (row) {
      var tr = document.createElement('tr');
      if (DETAILS && row.slug === ACTIVE) tr.className = 'active';
      activeCols().forEach(function (col) { tr.appendChild(cell(row, col)); });
      tbody.appendChild(tr);
    });
    document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
    document.getElementById('statInfo').textContent = filtered.length + ' / ' + DATA.length + ' 条';
    renderPager(total);
  }

  function applySort() {
    if (!sortKey) return;
    filtered.sort(function (a, b) {
      var va = a[sortKey], vb = b[sortKey];
      var both = (typeof va === 'number' && typeof vb === 'number');
      var cmp = both ? va - vb : String(va === undefined ? '' : va)
                                        .localeCompare(String(vb === undefined ? '' : vb), 'zh-Hans-CN');
      return sortAsc ? cmp : -cmp;
    });
  }

  function applyFilters() {
    var q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    var sel = document.getElementById('groupFilter');
    var g = sel ? sel.value : '';
    filtered = DATA.filter(function (row) {
      if (g && String(row.group) !== g) return false;
      if (!q) return true;
      return COLUMNS.some(function (col) {
        if (col.search === false) return false;
        var v = row[col.key];
        return String(v === undefined || v === null ? '' : v).toLowerCase().indexOf(q) !== -1;
      });
    });
    page = 1;
    applySort();
    render();
  }

  function sortBy(key) {
    if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
    document.querySelectorAll('#thead th').forEach(function (th) {
      th.classList.remove('sort-asc', 'sort-desc');
      if (th.dataset.key === key) th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    });
    applySort();
    render();
  }

  function init() {
    rebuildHeader();

    var sel = document.getElementById('groupFilter');
    if (sel) {
      GROUPS.forEach(function (g) {
        var o = document.createElement('option');
        o.value = g;
        o.textContent = g;
        sel.appendChild(o);
      });
      sel.addEventListener('change', applyFilters);
    }
    document.getElementById('searchInput').addEventListener('keyup', function (e) {
      if (e.key === 'Enter') applyFilters();
    });
    document.getElementById('searchBtn').addEventListener('click', applyFilters);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && MODE === 'detail') collapse();
    });
    if (DETAILS) {
      var m = /(?:^|[#&])p=([A-Za-z0-9_-]+)/.exec(location.hash || '');
      if (m && DETAILS[m[1]]) selectDetail(m[1], true);
    }
    applyFilters();
  }

  window.sortBy = sortBy;
