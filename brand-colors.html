<!--
===========================================================================
Karpathy Principles - AI编程四大原则
===========================================================================
1. 先思考 - 不假设，不隐藏困惑 → 不确定就问，多种解释列出
2. 保持简单 - 最小代码解决问题 → 无多余抽象
3. 精准修改 - 只改必须改的 → 不"顺便"改进邻接代码
4. 目标驱动 - 测试先行，验证闭环 → "修bug"→"写测试复现→让测试通过"

Version: 1.4(2026-11-06)
Description
- 品牌配色体系展示页：三配色体系（经典艺术色系 + 食材自然色系 + 彩虹七色），条目名格式「序号 中文名 英文名」空格分隔
- v1.4 新增「彩虹七色」tab（ROYGBIV：红/橙/黄/绿/蓝/靛/紫，靛蓝 #3F2A6E 深靛波段）
- v1.3 两体系条目重排（用户指定顺序）+ 名称键空格分隔
- v1.2 新增「食材自然色系」：Pantone 食材色卡 6 色（菠菜/紫叶菜/红洋葱/蘑菇/胡萝卜/红辣椒）
- v1.2 原始 JSON 由 Tab 改为右上角「源码」浮动按钮，弹出面板宽 80%、高 90%，内容跟随当前激活体系
- v1.1 新增「列表背景」色板：低饱和浅色（明度统一、色环均匀分布），供图片/视频/菜单列表按 index % N 循环取色
- 四面板（经典艺术色系/食材自然色系/彩虹七色/列表背景）切换，Bootstrap + Font Awesome

【功能清单】
| 功能 | 说明 |
|------|------|
| 经典艺术色系 | classic 面板展示 10 色经典艺术色（用户指定排序） |
| 食材自然色系 | food 面板展示 6 色 Pantone 食材色卡（用户指定排序） |
| 彩虹七色 | rainbow 面板展示 7 色光谱色（ROYGBIV） |
| 源码查看 | 右上角「源码」浮动按钮弹出当前体系 JSON（80%×90%），支持拷贝、ESC/遮罩关闭 |
| 复制颜色 | 点击颜色复制到剪贴板，toast 提示 |
| 列表背景色板 | listbg 面板展示 10 色浅色板 + 图片/视频/菜单三种场景循环预览 |
| 整组复制 | 一键拷贝列表背景色板的 JS 数组 |

【辅助工具】
| 工具方法 | 功能说明 |
|---------|---------|
| getContrastColor(hexColor) | 计算前景对比色（亮度公式） |
| copyToClipboard(text, btn) | 复制颜色到剪贴板并 toast 提示 |
| copyTextCL050(text, onOk, onFail) | 剪贴板写入（能力判断 + execCommand 回退） |

Related Paths
- 项目根目录: ~/CodeSpace/script-miner
- 页面目录: ~/CodeSpace/script-miner/projects/single-pages

Environments:

Dependency

Sublime Text

- Command + k, Command + j 展示所有函数代码

/* ── 剪贴板（SCRIPT-MINER-CL050 canonical）：能力判断前置 + execCommand 回退 + 失败可见反馈 ── */
function _copyFallbackCL050(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
function copyTextCL050(text, onOk, onFail) {
  const settle = (r) => {
    if (r) { if (typeof onOk === 'function') onOk(); return; }
    if (typeof onFail === 'function') { onFail(new Error('copy failed')); return; }
    try { if (typeof showToast === 'function') { showToast('⚠️ 复制失败，请手动选中复制'); return; } } catch (e) {}
    try { alert('复制失败，请手动选中复制'); } catch (e) {}
  };
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => settle(true)).catch(() => settle(_copyFallbackCL050(text)));
  } else {
    settle(_copyFallbackCL050(text));
  }
}

        function getContrastColor(hexColor) {
            // 移除#号
            const hex = hexColor.replace('#', '');

            // 解析RGB值
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);

            // 计算亮度（使用相对亮度公式）
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

            // 亮度大于0.5，使用黑色文字；否则使用白色文字
            return luminance > 0.5 ? '#000000' : '#FFFFFF';
        }
