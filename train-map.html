<!-- 
============================================================
高铁路线图 - 高铁车次路线可视化工具
============================================================

Description
- 使用 Leaflet 渲染高德地图，展示高铁车次路线
- 从 Supabase 数据库加载车次数据，支持多车次同时显示
- 提供车次列表弹框、时刻表面板等交互功能
- 支持通过 URL 参数指定车次，实现快速分享

Environments
- macOS 15.1.1 24B91
- Chrome 134.0.6998.166 / Safari 18.2
- IDE Trae CN 1.0.0 (Trae CN)
- LLM GLM-5 (智谱 AI)

Dependency
- Leaflet 1.9.3 - 地图渲染库
- jQuery 3.7.1 - DOM 操作库
- Supabase JS SDK 2.x - 数据库客户端
- Font Awesome 6.2.0 - 图标库

Sublime Text
- Command + k, Command + 1 收缩所有函数代码
- Command + k, Command + j 展示所有函数代码

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!--
    ============================================================
    高铁路线图 - 功能清单
    ============================================================
    
    【1】地图基础功能
        - 使用 Leaflet 渲染高德地图
        - 支持鼠标滚轮/触摸板缩放
        - 支持触摸拖拽
        - 自定义缩放控件
    
    【2】车次数据加载
        - 从 Supabase 数据库加载车次数据
        - 支持 URL 参数指定车次 (?no=车次编号)
        - 支持多车次同时加载 (?no=车次1,车次2)
        - 加载失败时使用默认 G80 数据
    
    【3】车次列表弹框
        - 显示所有可用车次列表
        - 支持多选功能（Checkbox）
        - 勾选状态记忆功能
        - 实时刷新地图和时刻表
    
    【4】地图路线渲染
        - 多车次颜色区分
        - 城市高亮圆圈
        - 站点标记（起点/终点/途经站）
        - 路线连接线
    
    【5】时刻表面板
        - 右上角固定宽度面板
        - 多车次时刻表合并显示
        - 每个车次可独立折叠/展开
        - Checkbox 控制地图显示（不影响车次列表）
        - 默认折叠状态
    
    【6】交互功能
        - 点击站点显示详细信息
        - 鼠标悬停显示站点名称
        - 地图自适应路线范围
        - URL 参数同步
    
    ============================================================
    -->
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    
    <title>高铁路线图</title>
    <meta name="description" content="高铁车次全程线路图：途经站点、购票区间高亮、时刻表与座位信息，数据来自 Supabase 只读表。">
    <meta property="og:title" content="高铁线路图">
    <meta property="og:description" content="高铁车次全程线路图：途经站点、购票区间高亮、时刻表与座位信息，数据来自 Supabase 只读表。">

        .loading-overlay {

            top: 0;

            width: 100%;

        var map;

        // ============================================================
        // 【8】工具函数 - 通用工具方法
        // ============================================================
        
        /**
         * 【8.1】获取 URL 参数
         * @param {string} param - 参数名称
         * @returns {string|null} 参数值，不存在则返回 null
         * @example
         *   getUrlParam('no') // 返回 URL 中 no 参数的值
         */
        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        /**
         * 【4.1.2.1】站名归一（去空白与尾缀「站」）
         * @description 与 CLI `_normalize_station_name()` 同规则：票面常写「上海虹桥站」，
         *              时刻表写「上海虹桥」，直接比较会漏匹配
         */
        function normalizeStationName(name) {
            return String(name || '').trim().replace(/站$/, '');
        }

        /**
         * 【4.1.2.2】按站名在 stations 中定位索引（先精确、再归一匹配）
         * @returns {number} 索引，未找到 -1
         */
        function findStationIndex(stations, name) {
            if (!stations || !name) return -1;
            const exact = stations.findIndex(s => s.stationName === name);
            if (exact !== -1) return exact;
            const target = normalizeStationName(name);
            if (!target) return -1;
            return stations.findIndex(s => normalizeStationName(s.stationName) === target);
        }

        /**
         * 【4.1.2.3】从车次名称推导购票段
         * @param {object} trainData - 车次数据（train_name 形如 '上海虹桥->郑州东'）
         * @returns {object|null} { from, to, fromIndex, toIndex, source:'train_name' }
         * @description 票载起终站是车次记录的固有字段（CLI 的 🟢上车站/🔴下车站也据此判定）；
         *              页面原先只认 URL from/to ⇒「CLI 有上下车站、页面无乘车路段」
         */
        function deriveSegmentFromTrainName(trainData) {
            const route = trainData && trainData.train_name;
            if (!route || route === 'UnSet' || String(route).indexOf('->') === -1) return null;
            const parts = String(route).split('->');
            const boardName = (parts[0] || '').trim();
            const alightName = (parts[1] || '').trim();
            if (!boardName || !alightName) return null;
            const stations = trainData.stations || [];
            const fromIndex = findStationIndex(stations, boardName);
            const toIndex = findStationIndex(stations, alightName);
            if (fromIndex === -1 || toIndex === -1 || fromIndex === toIndex) return null;
            return {
                from: stations[fromIndex].stationName,
                to: stations[toIndex].stationName,
                fromIndex,
                toIndex,
                source: 'train_name'
            };
        }

        /**
         * 【4.1.3】解析购票段（起终点）
         * @param {object} trainData - 车次数据
         * @returns {object|null} { from, to, fromIndex, toIndex, source }，无可用起终点返回 null（全程高亮）
         * @description 顺序：URL from/to（精确→归一匹配）→ 回退 train_name 的 A->B → 仍失败回退全程
         */
        function resolvePurchasedSegment(trainData) {
            if (!trainData || !trainData.stations) return null;
            const from = getUrlParam('from');
            const to = getUrlParam('to');

            if (from && to) {
                const fromIndex = findStationIndex(trainData.stations, from);
                const toIndex = findStationIndex(trainData.stations, to);
                if (fromIndex !== -1 && toIndex !== -1 && fromIndex !== toIndex) {
                    return {
                        from: trainData.stations[fromIndex].stationName,
                        to: trainData.stations[toIndex].stationName,
                        fromIndex,
                        toIndex,
                        source: 'url'
                    };
                }
                console.warn(`购票段起终点未在车次站点中找到: from=${from} to=${to}，回退车次名称推导`);
            }

            const derived = deriveSegmentFromTrainName(trainData);
            if (derived) return derived;
            if (from || to) console.warn('购票段无法解析，回退全程高亮');
            return null;
        }

        /**
         * 【4.1.4】判断站点是否在购票段内
         */
        function isInPurchasedSegment(index, segment) {
            if (!segment) return false;
            const lo = Math.min(segment.fromIndex, segment.toIndex);
            const hi = Math.max(segment.fromIndex, segment.toIndex);
            return index >= lo && index <= hi;
        }

        /**
         * 【8.2】显示错误提示
         * @param {string} message - 错误消息内容
         * @description 在页面顶部显示红色错误提示，5秒后自动消失
         */
        /**
         * 【7.3】导出当前界面为 PNG（地图 + 时刻表面板）
         * 文件名: 高铁{train_no}路线地图-{YYYYMMDD}.png
         * 底图跨域失败时自动降级为「无底图版」并提示
         */
        async function exportMapImage(btn) {
            if (typeof html2canvas !== 'function') {
                showError('图片导出不可用（html2canvas 未加载）');
                return;
            }
            const t = CURRENT_TRAIN || {};
            const no = t.train_no || '列车';
            const date = (t.depart_date || new Date().toISOString().slice(0, 10)).replace(/-/g, '');
            const filename = `高铁${no}路线地图-${date}.png`;
            const opts = {
                useCORS: true,
                // v2.0.5: 拷贝按钮不进导出图（截图是分享物，图标无意义）
                ignoreElements: (el) => !!(el.classList && (el.classList.contains('pb-copy') || el.classList.contains('pb-collapse') || el.classList.contains('zoom-collapse') || el.classList.contains('launcher-btn'))),
                scale: 2,
                backgroundColor: '#ffffff',
                logging: false,
                width: window.innerWidth,
                height: window.innerHeight
            };
            const save = (canvas) => {
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 4000);
                }, 'image/png');
            };
            if (btn) btn.disabled = true;
            document.body.classList.add('is-exporting');
            try {
                save(await html2canvas(document.body, opts));
            } catch (e) {
                console.warn('导出失败，尝试无底图模式:', e);
                const pane = document.querySelector('.leaflet-tile-pane');
                if (!pane) { showError('图片导出失败：' + (e && e.message || '')); return; }
                const prev = pane.style.display;
                pane.style.display = 'none';
                try {
                    save(await html2canvas(document.body, opts));
                    showError('底图跨域受限，已导出无底图版本');
                } catch (e2) {
                    showError('图片导出失败：' + (e2 && e2.message || '未知错误'));
                } finally {
                    pane.style.display = prev;
                }
            } finally {
                document.body.classList.remove('is-exporting');
                if (btn) btn.disabled = false;
            }
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        /**
         * 【8.2.1】显示普通提示（蓝色，不表示失败）
         * @param {string} message - 提示内容
         * @description 用于「同名车次多条、已按最近日期显示」这类信息性提示，
         *              与红色 showError 区分，避免把正常降级显示成故障
         */
        function showNotice(message) {
            const noticeDiv = document.createElement('div');
            noticeDiv.className = 'notice-message';
            noticeDiv.textContent = message;
            document.body.appendChild(noticeDiv);
            setTimeout(() => noticeDiv.remove(), 8000);
        }

        /**
         * 【8.3】隐藏加载动画
         * @description 隐藏页面加载时的遮罩层和加载动画
         */
        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        /**
         * 【8.4】将公里转换为地图像素半径
         * @param {number} km - 公里数
         * @param {number} lat - 纬度
         * @param {object} map - Leaflet 地图实例
         * @returns {number} 像素半径
         * @description 根据地图缩放级别和纬度计算像素半径
         */
        function kmToPixelRadius(km, lat, map) {
            var zoom = map.getZoom();
            var metersPerPixel = 40075016.686 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom + 8);
            var kmPerPixel = metersPerPixel / 1000;
            return km / kmPerPixel;
        }

        // ============================================================
        // 【2】数据加载 - 加载车次数据
        // ============================================================
        
        /**
         * 【2.0.1】本地日期戳 YYYYMMDD（模糊匹配用，不用 UTC 以免跨时区错一天）
         */
        function todayStamp() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
        }

        /**
         * 【2.0.2】把 YYYYMMDD 键转成与今天的天数差（绝对值）
         */
        function daysFromToday(stamp) {
            const y = Number(stamp.slice(0, 4)), m = Number(stamp.slice(4, 6)), d = Number(stamp.slice(6, 8));
            const target = new Date(y, m - 1, d);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.abs(Math.round((target - today) / 86400000));
        }

        /**
         * 【2.0.3】模糊匹配车次 key
         * @param {string} trainKey - 不含日期前缀的车次号（如 G1948）
         * @returns {object|null} { key, candidates }
         * @description 同号多日期时优先「今天」，否则取离今天最近的一条；
         *              原来是「日期最大优先」，会静默显示另一天的同号车（错站/错段来源）
         */
        function pickMatchingTrainKey(trainKey) {
            const candidates = Object.keys(TRAIN_DATA)
                .filter(key => key.endsWith(`-${trainKey}`))
                .sort((a, b) => b.split('-')[0].localeCompare(a.split('-')[0]));
            if (candidates.length === 0) return null;
            const exactToday = candidates.find(key => key.startsWith(todayStamp()));
            if (exactToday) return { key: exactToday, candidates };
            const nearest = candidates.slice().sort((a, b) => {
                const da = daysFromToday(a.split('-')[0]);
                const db = daysFromToday(b.split('-')[0]);
                if (da !== db) return da - db;
                return b.localeCompare(a);   // 等距时取较晚的一天
            })[0];
            return { key: nearest, candidates };
        }

        /**
         * 【2.1】加载车次数据
         * @returns {object|array} 单个车次数据对象或车次数据数组
         * @description 
         *   - 从 URL 参数获取车次编号 (?no=车次编号)
         *   - 支持多车次同时加载 (?no=车次1,车次2)
         *   - 支持模糊匹配（不带日期前缀；同号多日期取「今天/最近」，并提示可用精确 key）
         *   - 未指定车次时返回默认 G80（2026-05-25）快照数据
         * @example
         *   loadTrainData() // 根据URL参数加载车次数据
         */
        function loadTrainData() {
            const noParam = getUrlParam('no');
            
            if (!noParam) {
                console.log('未指定车次参数，使用默认 G80（2026-05-25）数据');
                return DEFAULT_TRAIN_DATA;
            }
            
            const trainKeys = noParam.split(',').map(key => key.replace(/\.(json|js)$/, ''));
            const datePattern = /^\d{8}-/;

            /**
             * 【2.1.1】解析单个 key（精确命中 → 模糊匹配），命中多条时提示
             */
            const resolveKey = (rawKey) => {
                if (TRAIN_DATA[rawKey]) {
                    console.log('加载成功:', rawKey, TRAIN_DATA[rawKey].train_name);
                    return TRAIN_DATA[rawKey];
                }
                if (!datePattern.test(rawKey)) {
                    const matched = pickMatchingTrainKey(rawKey);
                    if (matched) {
                        console.log(`模糊匹配: ${rawKey} -> ${matched.key}`, TRAIN_DATA[matched.key].train_name);
                        if (matched.candidates.length > 1) {
                            showNotice(`同名车次 ${matched.candidates.length} 条，已显示 ${matched.key}；指定日期用 ?no=${matched.key}`);
                        }
                        return TRAIN_DATA[matched.key];
                    }
                }
                console.error('未找到车次数据:', rawKey);
                return null;
            };

            if (trainKeys.length === 1) {
                const dataset = resolveKey(trainKeys[0]);
                if (dataset) return dataset;
                showError(`未找到车次数据: ${trainKeys[0]}，使用默认 G80（2026-05-25）数据`);
                return DEFAULT_TRAIN_DATA;
            }

            const trainDataList = trainKeys.map(resolveKey).filter(data => data !== null);
            if (trainDataList.length === 0) {
                showError('未找到任何有效的车次数据，使用默认 G80（2026-05-25）数据');
                return DEFAULT_TRAIN_DATA;
            }
            return trainDataList;
        }

        /**
         * 【4.1】获取站点坐标
         * @param {string} stationName - 站点名称
         * @returns {array} 坐标数组 [纬度, 经度, 高亮半径km]
         * @description 从站点坐标映射表中获取站点坐标，未找到则返回默认坐标
         */
        function getStationCoordinates(stationName) {
            return STATION_COORDINATES[stationName] || DEFAULT_COORDINATE;
        }

        /**
         * 【4.1.1】判断站点是否有真实坐标
         * @param {string} stationName - 站点名称
         * @returns {boolean} 坐标表中存在该站点时返回 true
         * @description 缺坐标站点不渲染标记/标签，也不参与路线连线与视野计算，避免堆叠到默认坐标
         */
        function hasStationCoordinates(stationName) {
            return Object.prototype.hasOwnProperty.call(STATION_COORDINATES, stationName);
        }

        /**
         * 【4.1.2】收集并提示缺坐标站点（同一批次只提示一次）
         * @param {array} trainDataList - 车次数据数组
         * @description 缺坐标站点在时刻表正常显示，但地图上跳过渲染
         */
        const warnedMissingStations = new Set();
        function warnMissingStations(trainDataList) {
            const missing = [];
            trainDataList.forEach(trainData => {
                (trainData.stations || []).forEach(station => {
                    const name = station.stationName;
                    if (!hasStationCoordinates(name) && !warnedMissingStations.has(name)) {
                        warnedMissingStations.add(name);
                        missing.push(name);
                    }
                });
            });
            if (missing.length > 0) {
                console.warn(`以下站点缺少坐标，地图已跳过渲染（时刻表不受影响）: ${missing.join('、')}`);
            }
        }

        /**
         * 【4.2】添加城市区域高亮
         * @param {object} station - 站点数据对象
         * @param {number} index - 站点索引
         * @param {number} totalStations - 总站点数
         * @param {string} color - 高亮颜色，默认 '#f1c40f'
         * @description 在地图上添加城市高亮圆圈和标签
         */
        function addCityHighlight(station, index, totalStations, color = '#f1c40f', segment = null) {
            if (!hasStationCoordinates(station.stationName)) return;

            const coords = getStationCoordinates(station.stationName);
            const lat = coords[0];
            const lng = coords[1];
            const kmRadius = coords[2];
            
            const isStart = index === 0;
            const isEnd = index === totalStations - 1;

            // 购票段起终点换色放大
            let fillColor = color;
            let radiusMul = 1;
            let extraClass = '';
            if (segment) {
                if (index === segment.fromIndex) {
                    fillColor = '#27ae60'; radiusMul = 1.3; extraClass = ' city-highlight-purchased-from';
                } else if (index === segment.toIndex) {
                    fillColor = '#e74c3c'; radiusMul = 1.3; extraClass = ' city-highlight-purchased-to';
                }
            }
            
            const pixelRadius = kmToPixelRadius(kmRadius * radiusMul, lat, map);
            
            const highlightCircle = L.circle(
                [lat, lng],
                {
                    radius: pixelRadius,
                    className: "city-highlight city-highlight-pulse" + extraClass,
                    fillColor: fillColor,
                    color: fillColor
                }
            ).addTo(map);
            
            cityHighlights.push(highlightCircle);
            
            let labelClass = "city-label";
            if (isStart) labelClass += " city-label-start";
            else if (isEnd) labelClass += " city-label-end";
            else labelClass += " city-label-middle";
            
            const labelIcon = L.divIcon({
                className: labelClass,
                html: '<span class="city-name">' + station.stationName + '</span>',
                iconSize: [100, 16],
                iconAnchor: [50, -17]
            });
            
            const labelMarker = L.marker([lat, lng], {
                icon: labelIcon,
                interactive: false
            }).addTo(map);
            
            cityLabels.push(labelMarker);
        }

        // ============================================================
        // 【4】添加站点标记
        // ============================================================
        
        /**
         * 【4.3】添加站点标记
         * @param {object} station - 站点数据对象
         * @param {number} index - 站点索引
         * @param {object} trainData - 车次数据对象
         * @description 在地图上添加站点标记，绑定弹窗和工具提示
         */
        function addStationMarker(station, index, trainData, color = null, segment = null) {
            if (!hasStationCoordinates(station.stationName)) return;

            const coords = getStationCoordinates(station.stationName);
            const lat = coords[0];
            const lng = coords[1];
            
            const totalStations = trainData.stations.length;
            const isStart = index === 0;
            const isEnd = index === totalStations - 1;

            // 购票段起终点用特殊 A/B 标记；段外站降透明度
            let marker;
            const isFrom = segment && index === segment.fromIndex;
            const isTo = segment && index === segment.toIndex;
            const inSeg = isInPurchasedSegment(index, segment);
            const dimmed = segment && !inSeg;

            if (isFrom || isTo) {
                const pinIcon = L.divIcon({
                    className: isFrom ? 'station-marker-from' : 'station-marker-to',
                    html: isFrom ? '起' : '终',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                marker = L.marker([lat, lng], { icon: pinIcon, zIndexOffset: 1000 }).addTo(map);
            } else {
                // v2.0.4: 序号并入圆点（图标与序号同一中心），18px 放不下两位数字 ⇒ 22px
                const stationNumber = station.stationNo ? Number(station.stationNo) || index + 1 : index + 1;
                const dotIcon = L.divIcon({
                    className: dimmed ? 'station-marker-mid station-marker-dimmed' : 'station-marker-mid',
                    html: `<span class="station-order">${stationNumber}</span>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });
                marker = L.marker([lat, lng], { icon: dotIcon }).addTo(map);
            }
            
            const popup = L.popup({
                maxWidth: 280,
                autoPan: true,
                autoPanPadding: [20, 20]
            });
            
            const arriveTime = isStart ? "起始站" : station.arrivalTime;
            const departTime = isEnd ? "终点站" : station.departureTime;
            
            const popupContent = `
                <div class="train-popup">
                    <b>🚄 ${trainData.train_no} - ${station.stationName}</b><br>
                    <div class="station-name">📍 途经城市：${station.stationName}</div>
                    <div class="time-info">到达：${arriveTime}</div>
                    <div class="time-info">发车：${departTime}</div>
                </div>
            `;
            
            popup.setContent(popupContent);
            marker.bindPopup(popup);
            
            marker.bindTooltip(
                `<div class="station-tooltip">${station.stationName}</div>`,
                { sticky: true, direction: "top" }
            );
            
            stationMarkers.push(marker);
        }

        // ============================================================
        // 【4】绘制路线
        // ============================================================
        
        /**
         * 【4.4】绘制路线
         * @param {object} trainData - 车次数据对象
         * @param {string} color - 路线颜色，默认 '#3498db'
         * @description 在地图上绘制车次路线，绑定弹窗和工具提示
         */
        function drawRoute(trainData, color = '#3498db', segment = null) {
            const routeStations = trainData.stations.filter(
                station => hasStationCoordinates(station.stationName)
            );
            if (routeStations.length < 2) return;

            const routeCoordinates = routeStations.map(station => {
                const coords = getStationCoordinates(station.stationName);
                return [coords[0], coords[1]];
            });

            // 全程折线（购票段模式下降透明度作为背景参照）
            const fullOpacity = segment ? 0.35 : 0.9;
            const fullWeight = segment ? 4 : 5;
            const routeLineItem = L.polyline(
                routeCoordinates,
                {
                    color: color,
                    opacity: fullOpacity,
                    weight: fullWeight,
                    smoothFactor: 2.0,
                    className: segment ? "route-full" : "route-main"
                }
            ).addTo(map);
            
            routeLines.push(routeLineItem);
            
            const routePopup = L.popup({ maxWidth: 280 });
            
            const totalStations = trainData.stations.length;
            const startStation = trainData.stations[0].stationName;
            const endStation = trainData.stations[totalStations - 1].stationName;
            
            const routePopupContent = `
                <div class="route-popup">
                    <div class="route-title">🚄 ${trainData.train_no}次高铁</div>
                    <div class="route-info">
                        ${startStation} → ${endStation}<br>
                        ${trainData.depart_date} | ${totalStations}个途经城市
                    </div>
                </div>
            `;
            
            routePopup.setContent(routePopupContent);
            routeLineItem.bindPopup(routePopup);
            
            routeLineItem.bindTooltip(
                `<div>${trainData.train_no}次线路</div>`,
                { sticky: true, direction: "bottom" }
            );

            // 购票段高亮折线（叠加在全程之上）
            if (segment) {
                const segCoords = trainData.stations
                    .filter((s, i) => isInPurchasedSegment(i, segment))
                    .filter(s => hasStationCoordinates(s.stationName))
                    .map(s => {
                        const c = getStationCoordinates(s.stationName);
                        return [c[0], c[1]];
                    });
                if (segCoords.length >= 2) {
                    const segLine = L.polyline(segCoords, {
                        color: '#e74c3c',
                        opacity: 0.95,
                        weight: 7,
                        smoothFactor: 1.0,
                        className: "route-purchased"
                    }).addTo(map);
                    routeLines.push(segLine);

                    const segPopup = L.popup({ maxWidth: 240 });
                    segPopup.setContent(`
                        <div class="route-popup">
                            <div class="route-title" style="color:#e74c3c">🎫 购票段</div>
                            <div class="route-info">
                                ${segment.from} → ${segment.to}<br>
                                ${trainData.depart_date}
                            </div>
                        </div>
                    `);
                    segLine.bindPopup(segPopup);
                    segLine.bindTooltip(`<div>购票段：${segment.from}→${segment.to}</div>`, { sticky: true, direction: "top" });
                }
            }
        }

        // ============================================================
        // 【4】站名碰撞消解（相近城市的节点/序号/站名不再互相压）
        // ============================================================

        /** zoom 低于该值时只保留圆点内序号，隐藏站名（相邻小站站名必压） */
        const HIDE_CITY_NAME_BELOW_ZOOM = 7;

        /**
         * 【4.4.1】站名碰撞消解
         * @description 站名逐行贪心下移：与已放置的站名矩形相交就往下挪一行（行高+2px），
         *              位移施加在 `.city-name` 内层 span 上（不碰 Leaflet 控制的 marker transform）。
         *              顺序按视口 top 升序，保证靠上的站名优先占位。
         */
        function layoutCityNames() {
            const host = document.getElementById('map');
            if (!host || host.classList.contains('hide-city-labels') || host.classList.contains('hide-city-names')) return;

            const nameEls = Array.from(document.querySelectorAll('.city-label .city-name'));
            nameEls.forEach(el => { el.style.transform = ''; });
            if (nameEls.length < 2) return;

            const placed = [];
            // 圆点先占位：站名除了互不压，也不能压到邻近站点的圆点/序号
            Array.from(document.querySelectorAll('.station-marker-mid, .station-marker-from, .station-marker-to'))
                .forEach(el => {
                    const r = el.getBoundingClientRect();
                    if (r.width > 0 && r.height > 0) placed.push({ left: r.left, top: r.top, width: r.width, height: r.height });
                });
            const items = nameEls.map(el => ({ el, rect: el.getBoundingClientRect() }))
                .filter(item => item.rect.width > 0 && item.rect.height > 0)
                .sort((a, b) => (a.rect.top - b.rect.top) || (a.rect.left - b.rect.left));

            items.forEach(item => {
                const w = item.rect.width, h = item.rect.height;
                const left = item.rect.left;
                let top = item.rect.top;
                let dy = 0;
                let guard = 0;
                const hits = () => placed.some(p =>
                    left < p.left + p.width && left + w > p.left &&
                    top < p.top + p.height && top + h > p.top);
                while (guard++ < 40 && hits()) {
                    top += h + 2;
                    dy += h + 2;
                }
                if (dy) item.el.style.transform = `translateY(${dy}px)`;
                placed.push({ left, top, width: w, height: h });
            });
        }

        /**
         * 【4.4.2】按缩放级别同步站名显隐并重排碰撞
         * @description zoom < HIDE_CITY_NAME_BELOW_ZOOM 时只留圆点内序号（该级别相邻小站站名必重叠）
         */
        function syncCityNameVisibility() {
            const host = document.getElementById('map');
            if (!host || !map) return;
            host.classList.toggle('hide-city-names', map.getZoom() < HIDE_CITY_NAME_BELOW_ZOOM);
            layoutCityNames();
        }

        /**
         * 【4.5】清除地图元素
         * @description 清除地图上的所有城市高亮、标签、站点标记和路线
         */
        function clearMapElements() {
            cityHighlights.forEach(item => map.removeLayer(item));
            cityLabels.forEach(item => map.removeLayer(item));
            stationMarkers.forEach(item => map.removeLayer(item));
            routeLines.forEach(item => map.removeLayer(item));
            
            cityHighlights = [];
            cityLabels = [];
            stationMarkers = [];
            routeLines = [];

            const badges = document.getElementById('purchased-badges');
            if (badges) badges.remove();
            const badge = document.getElementById('purchased-badge');
            if (badge) badge.remove();
            const legend = document.getElementById('map-legend');
            if (legend) legend.remove();
        }

        // ============================================================
        // 【4】路线渲染 - 渲染单车次数据
        // ============================================================
        
        /**
         * 【4.6】渲染单车次数据
         * @param {object} trainData - 车次数据对象
         * @description 渲染单个车次的路线、站点和时刻表，并调整地图视野
         */
        function renderTrainData(trainData) {
            CURRENT_TRAIN = trainData || null;
            clearMapElements();
            
            currentTrainData = trainData;
            const totalStations = trainData.stations.length;
            const segment = resolvePurchasedSegment(trainData);
            
            document.title = `${trainData.train_no}高铁路线图`;
            
            warnMissingStations([trainData]);

            trainData.stations.forEach((station, index) => {
                addCityHighlight(station, index, totalStations, '#f1c40f', segment);
                addStationMarker(station, index, trainData, null, segment);
            });
            
            drawRoute(trainData, '#3498db', segment);
            
            renderTimetable([trainData], segment);
            renderPurchasedBadge(segment, trainData);
            renderLegend(segment);
            
            const allStationPoints = trainData.stations
                .filter(station => hasStationCoordinates(station.stationName))
                .map(station => {
                    const coords = getStationCoordinates(station.stationName);
                    return L.latLng(coords[0], coords[1]);
                });

            if (allStationPoints.length === 0) return;
            
            const bounds = L.latLngBounds(allStationPoints);
            const paddingValue = window.innerWidth < 768 ? [30, 30] : [50, 50];
            
            map.fitBounds(bounds, {
                padding: paddingValue,
                maxZoom: 12
            });

            syncCityNameVisibility();
        }
        
        // ============================================================
        // 【4】路线渲染 - 渲染多车次数据
        // ============================================================
        
        /**
         * 【4.7】渲染多车次数据
         * @param {array} trainDataList - 车次数据数组
         * @param {boolean} renderTimetableAlso - 是否同时渲染时刻表，默认 true
         * @description 渲染多个车次的路线、站点，使用不同颜色区分
         */
        function renderMultipleTrains(trainDataList, renderTimetableAlso = true) {
            clearMapElements();
            
            currentTrainData = trainDataList[0];
            
            const trainNames = trainDataList.map(t => t.train_no).join('、');
            document.title = `${trainNames}次高铁路线图`;
            
            visibleTrainKeys = trainDataList.map(trainData => 
                `${trainData.depart_date.replace(/-/g, '')}-${trainData.train_no}`
            );
            
            const allStationPoints = [];
            
            const colors = ['#3498db', '#e74c3c', '#27ae60', '#9b59b6', '#f39c12', '#1abc9c'];
            
            warnMissingStations(trainDataList);

            const segments = trainDataList.map(t => resolvePurchasedSegment(t));

            trainDataList.forEach((trainData, trainIndex) => {
                const totalStations = trainData.stations.length;
                const color = colors[trainIndex % colors.length];
                const segment = segments[trainIndex];
                
                trainData.stations.forEach((station, index) => {
                    addCityHighlight(station, index, totalStations, color, segment);
                    addStationMarker(station, index, trainData, color, segment);
                });
                
                drawRoute(trainData, color, segment);
                
                trainData.stations
                    .filter(station => hasStationCoordinates(station.stationName))
                    .forEach(station => {
                        const coords = getStationCoordinates(station.stationName);
                        allStationPoints.push(L.latLng(coords[0], coords[1]));
                    });
            });
            
            if (renderTimetableAlso) {
                renderTimetable(trainDataList, segments);
            }
            const anySegment = segments.find(s => s) || null;
            // v2.0.5: 多车次时每趟各一块徽标、各带拷贝按钮
            renderPurchasedBadges(trainDataList.map((t, i) => ({ segment: segments[i], trainData: t })));
            renderLegend(anySegment);
            
            if (allStationPoints.length > 0) {
                const bounds = L.latLngBounds(allStationPoints);
                const paddingValue = window.innerWidth < 768 ? [30, 30] : [50, 50];
                
                map.fitBounds(bounds, {
                    padding: paddingValue,
                    maxZoom: 12
                });
            }

            syncCityNameVisibility();
        }
        
        // ============================================================
        // 【5】渲染时刻表面板
        // ============================================================
        const mobileTimetableMedia = window.matchMedia('(max-width: 768px)');

        function syncTimetableColumns() {
            document.querySelectorAll('.train-section-header td').forEach((cell) => {
                cell.colSpan = mobileTimetableMedia.matches ? 3 : 5;
            });
        }

        function renderTimetable(trainDataList, segmentOrSegments = null) {
            const trainNoEl = document.getElementById('timetable-train-no');
            const trainDateEl = document.getElementById('timetable-train-date');
            const tbody = document.getElementById('timetable-tbody');
            
            if (trainDataList.length === 1) {
                trainNoEl.textContent = trainDataList[0].train_no;
                trainDateEl.textContent = trainDataList[0].depart_date;
            } else {
                const trainNos = trainDataList.map(t => t.train_no).join('、');
                trainNoEl.textContent = `${trainNos} (${trainDataList.length}趟)`;
                trainDateEl.textContent = '';
            }
            
            tbody.innerHTML = '';
            
            const colors = ['#3498db', '#e74c3c', '#27ae60', '#9b59b6', '#f39c12', '#1abc9c'];
            
            trainDataList.forEach((trainData, trainIndex) => {
                const color = colors[trainIndex % colors.length];
                const stations = trainData.stations || [];
                const totalStations = stations.length;
                const trainKey = `${trainData.depart_date.replace(/-/g, '')}-${trainData.train_no}`;
                const isVisible = visibleTrainKeys.includes(trainKey);
                const segment = Array.isArray(segmentOrSegments) ? segmentOrSegments[trainIndex] : segmentOrSegments;
                
                const headerRow = document.createElement('tr');
                headerRow.className = 'train-section-header';
                headerRow.style.background = color;
                headerRow.style.color = 'white';
                headerRow.dataset.trainIndex = trainIndex;
                headerRow.dataset.trainKey = trainKey;
                
                headerRow.innerHTML = `
                    <td colspan="5">
                        <input type="checkbox" class="train-section-checkbox" ${isVisible ? 'checked' : ''} onchange="toggleTrainOnMap(${trainIndex}, this.checked, event)">
                        <span class="train-section-title">${trainData.train_no}次 - ${trainData.train_name}</span>
                        <button class="train-section-toggle" onclick="toggleTrainSection(${trainIndex}, event)">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(headerRow);
                
                stations.forEach((station, index) => {
                    const row = document.createElement('tr');
                    row.className = `train-section-row-${trainIndex}`;
                    row.style.display = 'none';
                    
                    if (index === 0) {
                        row.classList.add('start-station');
                    } else if (index === totalStations - 1) {
                        row.classList.add('end-station');
                    }

                    // 购票段行高亮
                    if (segment) {
                        if (index === segment.fromIndex) row.classList.add('purchased-from');
                        else if (index === segment.toIndex) row.classList.add('purchased-to');
                        else if (isInPurchasedSegment(index, segment)) row.classList.add('in-segment');
                    }
                    
                    const arrivalTime = station.arrivalTime || '-';
                    const departureTime = station.departureTime || '-';
                    const stopTime = station.stopTime || '-';
                    
                    row.innerHTML = `
                        <td class="col-order">${station.stationNo}</td>
                        <td class="station-name col-station">${station.stationName}</td>
                        <td class="time col-arrival">${arrivalTime}</td>
                        <td class="time col-departure">${departureTime}</td>
                        <td class="stop-time col-stop">${stopTime}</td>
                    `;
                    
                    tbody.appendChild(row);
                });
            });
            syncTimetableColumns();
        }

        /** 线上行程页基址：复制文本里的链接固定指线上，本地/线上口径一致 */
        const ONLINE_MAP_BASE = 'https://tools.cli.jaden.tech/train-map.html';

        /**
         * 【5.4.1】空值判定（'UnSet' / 'pending' / '在线查询' 都是占位，不写进面板与复制文本）
         */
        function isBlankValue(value) {
            const s = String(value == null ? '' : value).trim();
            return s === '' || /^(unset|pending|在线查询)$/i.test(s);
        }

        /**
         * 【5.4.2】'HH:MM' → 当日分钟数；非时间返回 null
         */
        function parseClock(value) {
            const m = /^(\d{1,2}):(\d{2})$/.exec(String(value == null ? '' : value).trim());
            if (!m) return null;
            const h = Number(m[1]), mi = Number(m[2]);
            if (h > 23 || mi > 59) return null;
            return h * 60 + mi;
        }

        /**
         * 【5.4.3】分钟数 → '4小时44分' / '52分钟'
         */
        function formatDuration(totalMinutes) {
            if (totalMinutes == null || totalMinutes < 0) return '';
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            if (h === 0) return `${m}分钟`;
            return m === 0 ? `${h}小时` : `${h}小时${m}分`;
        }

        /**
         * 【5.4.4】累计行车时间字段 distance（'X小时Y分钟'）→ 分钟；无值返回 null
         */
        function parseDistanceMinutes(text) {
            const s = String(text == null ? '' : text);
            const h = /(\d+)\s*小时/.exec(s);
            const mi = /(\d+)\s*分钟/.exec(s);
            if (!h && !mi) return null;
            return (h ? Number(h[1]) * 60 : 0) + (mi ? Number(mi[1]) : 0);
        }

        /**
         * 【5.4.5】购票段时间口径：上车点发车 → 下车点到达（跨天 +24h）
         * @returns {object} { depart, arrive, duration, durationMinutes, crossDay }
         * @description 首站 arrivalTime / 末站 departureTime 是「起始站/终点站」哨兵，取同站另一时间兜底；
         *              duration 以时间差为准（用户视角：几点上车、几点下车），累计 distance 差仅作交叉校验。
         */
        function segmentTimes(segment, trainData) {
            const empty = { depart: '', arrive: '', duration: '', durationMinutes: null, crossDay: false };
            if (!segment || !trainData || !trainData.stations) return empty;
            const fromStation = trainData.stations[segment.fromIndex] || {};
            const toStation = trainData.stations[segment.toIndex] || {};

            let departRaw = fromStation.departureTime;
            let departMins = parseClock(departRaw);
            if (departMins === null) {
                departRaw = fromStation.arrivalTime;
                departMins = parseClock(departRaw);
            }
            let arriveRaw = toStation.arrivalTime;
            let arriveMins = parseClock(arriveRaw);
            if (arriveMins === null) {
                arriveRaw = toStation.departureTime;
                arriveMins = parseClock(arriveRaw);
            }
            if (departMins === null || arriveMins === null) return empty;

            let crossDay = false;
            let durationMinutes = arriveMins - departMins;
            if (durationMinutes < 0) {
                durationMinutes += 24 * 60;
                crossDay = true;
            }

            const cumTo = parseDistanceMinutes(toStation.distance);
            const cumFrom = parseDistanceMinutes(fromStation.distance);
            if (cumTo !== null && cumFrom !== null && Math.abs((cumTo - cumFrom) - durationMinutes) > 2) {
                console.warn(`购票段历时口径不一致：时间差=${durationMinutes}分，累计差=${cumTo - cumFrom}分（以时间差为准）`);
            }

            return {
                depart: String(departRaw).trim(),
                arrive: String(arriveRaw).trim(),
                duration: formatDuration(durationMinutes),
                durationMinutes,
                crossDay
            };
        }

        /**
         * 【5.4.6】生成购票段 Markdown（精简 6 行，可直接粘贴）
         * @param {object} segment - 购票段 { from, to, fromIndex, toIndex }
         * @param {object} trainData - 车次数据
         * @param {string} [linkUrl] - 行程链接，缺省用线上地址 + 精确车次 key
         */
        function buildSegmentMarkdown(segment, trainData, linkUrl) {
            if (!segment || !trainData) return '';
            const stations = trainData.stations || [];
            const count = stations.filter((s, i) => isInPurchasedSegment(i, segment)).length;
            const times = segmentTimes(segment, trainData);
            const lines = [`## 🎫 ${trainData.train_no} · ${trainData.depart_date} · ${segment.from} → ${segment.to}`, ''];

            if (times.depart) lines.push(`- 发车：${times.depart}（${segment.from}）`);
            if (times.arrive) lines.push(`- 到站：${times.arrive}（${segment.to}）`);
            lines.push(`- ${[times.duration ? `历时 ${times.duration}` : '', `共 ${count} 站`].filter(Boolean).join(' · ')}`);

            const seat = isBlankValue(trainData.seat) ? '' : String(trainData.seat).trim();
            const gate = isBlankValue(trainData.ticket_checkpoint) ? '' : String(trainData.ticket_checkpoint).trim();
            const seatBits = [];
            if (seat) seatBits.push(`座位 ${seat}`);
            if (gate) seatBits.push(`检票口 ${gate}`);
            if (seatBits.length) lines.push(`- ${seatBits.join(' · ')}`);

            const fallbackKey = `${String(trainData.depart_date || '').replace(/-/g, '')}-${trainData.train_no || ''}`;
            const link = linkUrl || `${ONLINE_MAP_BASE}?no=${fallbackKey}`;
            if (link) lines.push(`- 行程图：${link}`);

            return lines.join('\n');
        }

        /**
         * 【5.4.7】复制到剪贴板：能力判断前置 + execCommand 回退 + 失败可见反馈
         * @description 与 train-timetable.html 的 copyTextCL050 同口径。
         *              本地 http://jaden.local:8081 是非安全上下文（实测 isSecureContext=false、
         *              navigator.clipboard 不存在），必须走 textarea + execCommand 回退。
         */
        function copyTextToClipboard(text, onOk, onFail) {
            const notify = (ok) => {
                if (ok) { if (typeof onOk === 'function') onOk(); }
                else if (typeof onFail === 'function') onFail(new Error('copy failed'));
            };
            const fallback = () => {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
                    document.body.appendChild(ta);
                    ta.select();
                    ta.setSelectionRange(0, ta.value.length);
                    const ok = document.execCommand('copy');
                    ta.remove();
                    notify(ok);
                } catch (e) {
                    console.warn('execCommand 复制失败:', e);
                    notify(false);
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => notify(true)).catch(fallback);
            } else {
                fallback();
            }
        }

        /**
         * 【5.4.8】点击拷贝按钮：生成 Markdown → 复制 → 可见反馈
         */
        function copySegmentInfo(btn, segment, trainData) {
            const text = buildSegmentMarkdown(segment, trainData);
            if (!text) { showError('购票段信息为空，无法复制'); return; }
            const original = btn ? btn.innerHTML : '';
            copyTextToClipboard(
                text,
                () => {
                    showNotice('已复制购票段信息（Markdown）');
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-check"></i>';
                        btn.classList.add('is-done');
                        setTimeout(() => {
                            btn.innerHTML = original;
                            btn.classList.remove('is-done');
                        }, 1600);
                    }
                },
                (err) => showError(`复制失败：${(err && err.message) || '未知错误'}`)
            );
        }

        /**
         * 【4.2.x】购票段面板折叠状态
         * 为什么存模块级 Set 而不是 DOM class：renderPurchasedBadges() 每次渲染都重建 DOM
         * （clearMapElements() 整块 remove），只放 class 会在切车次/勾选显隐后丢失。
         * 生命周期：本页会话内保留（刷新复位）；不落 localStorage —— 这页是分享/截图工具，
         * 跨会话记住收起态反而让人以为「面板丢了」。
         */
        const collapsedBadgeKeys = new Set();

        function badgeKeyOf(trainData) {
            if (!trainData) return '';
            return `${String(trainData.depart_date || '').replace(/-/g, '')}-${trainData.train_no || ''}`;
        }

        function formatBadgeTitle(trainData) {
            const no = trainData && trainData.train_no ? String(trainData.train_no).trim() : '';
            return no || '购票段';
        }

        function isBadgeCollapsed(keys, key) {
            if (!keys || !key) return false;
            if (typeof keys.has === 'function') return keys.has(key);
            return Array.isArray(keys) ? keys.indexOf(key) !== -1 : false;
        }

        /** 折叠/展开一块徽标（纯 UI 状态，不动数据） */
        function applyBadgeCollapse(badge, collapsed, trainData, segment) {
            if (!badge || !badge.classList) return;
            const key = badgeKeyOf(trainData);
            const title = formatBadgeTitle(trainData);
            const route = segment ? `${segment.from} → ${segment.to}` : '';

            badge.classList.toggle('is-collapsed', !!collapsed);
            const collapseBtn = badge.querySelector('.pb-collapse');
            if (collapseBtn) {
                collapseBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                collapseBtn.title = collapsed ? '展开面板' : '收起面板（避免遮挡路线）';
            }

            if (collapsed) {
                badge.setAttribute('role', 'button');
                badge.setAttribute('tabindex', '0');
                badge.setAttribute('aria-label', `展开购票段面板（${title}${route ? ' · ' + route : ''}）`);
                badge.title = [title, route].filter(Boolean).join(' · ');
            } else {
                badge.removeAttribute('role');
                badge.removeAttribute('tabindex');
                badge.setAttribute('aria-label', `购票段 ${title}`);
                badge.title = '';
            }
            if (key && !collapsed) collapsedBadgeKeys.delete(key);
        }

        function toggleBadgeCollapse(badge, trainData, segment) {
            const key = badgeKeyOf(trainData);
            const collapsed = !badge.classList.contains('is-collapsed');
            if (collapsed && key) collapsedBadgeKeys.add(key);
            applyBadgeCollapse(badge, collapsed, trainData, segment);
        }

        /**
         * 【5.4】渲染购票段徽标（左上角，多车次时每趟一块、各带「折叠 + 拷贝」按钮）
         * @param {array} entries - [{ segment, trainData }, ...]，segment 为空的项跳过
         */
        function renderPurchasedBadges(entries) {
            const mapContainer = document.getElementById('map-container');
            if (!mapContainer || !entries || entries.length === 0) return;

            const container = document.createElement('div');
            container.id = 'purchased-badges';
            let seq = 0;

            entries.forEach(entry => {
                const segment = entry && entry.segment;
                const trainData = entry && entry.trainData;
                if (!segment || !trainData) return;

                const segStations = (trainData.stations || []).filter((s, i) => isInPurchasedSegment(i, segment));
                const times = segmentTimes(segment, trainData);
                const timeBits = [];
                if (times.depart) timeBits.push(`发车 ${times.depart}`);
                if (times.arrive) timeBits.push(`到站 ${times.arrive}`);
                if (times.duration) timeBits.push(`历时 ${times.duration}`);

                const seat = isBlankValue(trainData.seat) ? '' : String(trainData.seat).trim();
                const gate = isBlankValue(trainData.ticket_checkpoint) ? '' : String(trainData.ticket_checkpoint).trim();
                const seatBits = [];
                if (seat) seatBits.push(`座位 ${seat}`);
                if (gate) seatBits.push(`检票口 ${gate}`);

                const badge = document.createElement('div');
                badge.className = 'purchased-badge';
                if (seq === 0) badge.id = 'purchased-badge';   // 兼容只取首个徽标的既有脚本
                badge.innerHTML = `
                    <div class="pb-actions">
                        <button class="pb-collapse" type="button" title="收起面板（避免遮挡路线）" aria-label="收起购票段面板" aria-expanded="true"><i class="fas fa-chevron-up"></i></button>
                        <button class="pb-copy" type="button" title="复制购票段信息（Markdown）" aria-label="复制购票段信息"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="pb-title">${formatBadgeTitle(trainData)}</div>
                    <div class="pb-route">${segment.from} → ${segment.to}</div>
                    ${timeBits.length ? `<div class="pb-time">${timeBits.join(' · ')}</div>` : ''}
                    <div class="pb-meta">${trainData.depart_date} · 共 ${segStations.length} 站</div>
                    ${seatBits.length ? `<div class="pb-seat">${seatBits.join(' · ')}</div>` : ''}
                `;

                L.DomEvent.disableClickPropagation(badge);
                const btn = badge.querySelector('.pb-copy');
                if (btn) {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        copySegmentInfo(btn, segment, trainData);
                    });
                }

                const collapseBtn = badge.querySelector('.pb-collapse');
                if (collapseBtn) {
                    collapseBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleBadgeCollapse(badge, trainData, segment);
                    });
                }

                // 折叠态整块就是「展开」按钮（键盘 Enter/Space 同样可用）
                badge.addEventListener('click', (e) => {
                    if (!badge.classList.contains('is-collapsed')) return;
                    e.stopPropagation();
                    toggleBadgeCollapse(badge, trainData, segment);
                });
                badge.addEventListener('keydown', (e) => {
                    if (!badge.classList.contains('is-collapsed')) return;
                    if (e.key !== 'Enter' && e.key !== ' ') return;
                    e.preventDefault();
                    e.stopPropagation();
                    toggleBadgeCollapse(badge, trainData, segment);
                });

                // v2.0.9：展开态点标题也收起（与 .pb-collapse 同义）；收起态交给整块点击展开
                const titleEl = badge.querySelector('.pb-title');
                if (titleEl) {
                    titleEl.title = '点击收起面板';
                    titleEl.addEventListener('click', (e) => {
                        if (badge.classList.contains('is-collapsed')) return;
                        e.stopPropagation();
                        toggleBadgeCollapse(badge, trainData, segment);
                    });
                }

                // 按模块级状态复原折叠态（切车次/勾选显隐后重渲染也不丢）
                applyBadgeCollapse(badge, isBadgeCollapsed(collapsedBadgeKeys, badgeKeyOf(trainData)), trainData, segment);

                container.appendChild(badge);
                seq += 1;
            });

            if (container.children.length === 0) return;
            mapContainer.appendChild(container);
        }

        /**
         * 【5.4.0】单车次兼容入口（内部转调 renderPurchasedBadges）

        function renderPurchasedBadge(segment, trainData) {

        /**
         * 【5.3】折叠/展开时刻表面板（v2.0.9：整块收起成圆形入口按钮）
         * @description 收起 = 面板 display:none + 右上角圆形 fa-list 按钮出现；点圆钮恢复。
         *              折叠状态存模块级布尔（同 collapsedBadgeKeys 口径：本页会话保留、刷新复位、
         *              不写 localStorage —— 分享/截图页持久化 UI 状态会让人以为界面坏了）。
         */
        let timetablePanelCollapsed = false;

        function setTimetableCollapsed(collapsed) {
            const panel = document.getElementById('timetable-panel');
            const launcher = document.getElementById('timetable-launcher');
            if (!panel) return;
            timetablePanelCollapsed = !!collapsed;
            panel.classList.toggle('is-collapsed', timetablePanelCollapsed);
            if (launcher) launcher.classList.toggle('is-shown', timetablePanelCollapsed);
        }

        function toggleTimetable() {
            setTimetableCollapsed(!document.getElementById('timetable-panel').classList.contains('is-collapsed'));
        }

        let timetablePanelTranslucent = false;

        function setTimetableTranslucent(translucent) {
            timetablePanelTranslucent = !!translucent;
            const panel = document.getElementById('timetable-panel');
            const button = document.getElementById('timetable-opacity-btn');
            if (panel) panel.classList.toggle('is-translucent', timetablePanelTranslucent);
            if (button) {
                button.setAttribute('aria-pressed', String(timetablePanelTranslucent));
                button.setAttribute('aria-label', timetablePanelTranslucent ? '恢复时刻表不透明' : '时刻表半透明');
                button.title = timetablePanelTranslucent ? '恢复时刻表不透明' : '时刻表半透明';
            }
        }

        /**
         * 【5.4】绑定顶栏右侧按钮（半透明 + 切换车次）
         * @description header 整条带 onclick="toggleTimetable()"，所以切换车次必须
         *              stopPropagation，否则点「切换车次」会连带把时刻表折叠起来。
         *              注意：折叠箭头本身**不能** stopPropagation —— 它靠冒泡到 header 的
         *              onclick 才能折叠（给它加 e.stopPropagation() 会让折叠按钮失效）。
         */
        function bindHeaderButtons() {
            const opacityBtn = document.getElementById('timetable-opacity-btn');
            if (opacityBtn) {
                opacityBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    setTimetableTranslucent(!timetablePanelTranslucent);
                });

                });

        }

        function bindLaunchers() {

        /**

         *              fa-list 按钮，点它恢复。状态同样只存模块级布尔。
         */
        let zoomControlEl = null;
        let zoomPanelCollapsed = false;

        function setZoomCollapsed(collapsed) {
            zoomPanelCollapsed = !!collapsed;
            if (zoomControlEl) zoomControlEl.classList.toggle('is-collapsed', zoomPanelCollapsed);

            if (launcher) {

        // ============================================================
        // 【3】显示车次列表弹框
        // ============================================================
        let selectedTrainKeys = [];
        let visibleTrainKeys = [];
        
        /**
         * 【3.1】显示车次列表弹框
         * @description 显示车次列表弹框，支持多选功能
         */
        function showTrainListModal() {
            const modal = document.getElementById('train-list-modal');
            const body = document.getElementById('train-list-body');
            
            body.innerHTML = '';
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            TRAIN_LIST.forEach((train, index) => {
                const trainKey = `${train.depart_date.replace(/-/g, '')}-${train.train_no}`;
                const trainData = TRAIN_DATA[trainKey];
                
                let stationCount = 0;
                let duration = '';
                
                if (trainData && trainData.stations && trainData.stations.length > 0) {
                    const routeParts = train.train_name.split('->');
                    const startStationName = routeParts[0] ? routeParts[0].replace(/站$/, '') : '';
                    const endStationName = routeParts[1] ? routeParts[1].replace(/站$/, '') : '';
                    
                    const stations = trainData.stations;
                    let startIndex = -1;
                    let endIndex = -1;
                    
                    for (let i = 0; i < stations.length; i++) {
                        const stationName = stations[i].stationName.replace(/站$/, '');
                        if (stationName === startStationName || stationName.includes(startStationName) || startStationName.includes(stationName)) {
                            startIndex = i;
                        }
                        if (stationName === endStationName || stationName.includes(endStationName) || endStationName.includes(stationName)) {
                            endIndex = i;
                        }
                    }
                    
                    if (startIndex >= 0 && endIndex >= 0 && startIndex <= endIndex) {
                        stationCount = endIndex - startIndex + 1;
                        
                        const startStation = stations[startIndex];
                        const endStation = stations[endIndex];
                        
                        const departTime = startStation.departureTime;
                        const arriveTime = endStation.arrivalTime;
                        
                        if (departTime && arriveTime && departTime !== '起始站' && arriveTime !== '终点站') {
                            const [depH, depM] = departTime.split(':').map(Number);
                            const [arrH, arrM] = arriveTime.split(':').map(Number);
                            
                            let totalMinutes = (arrH * 60 + arrM) - (depH * 60 + depM);
                            if (totalMinutes < 0) totalMinutes += 24 * 60;
                            
                            const hours = Math.floor(totalMinutes / 60);
                            const minutes = totalMinutes % 60;
                            
                            if (hours > 0) {
                                duration = `（${stationCount}站，${hours}小时${minutes}分钟）`;
                            } else {
                                duration = `（${stationCount}站，${minutes}分钟）`;
                            }
                        }
                    } else {
                        stationCount = stations.length;
                        
                        const firstStation = stations[0];
                        const lastStation = stations[stationCount - 1];
                        
                        const departTime = firstStation.departureTime;
                        const arriveTime = lastStation.arrivalTime;
                        
                        if (departTime && arriveTime && departTime !== '起始站' && arriveTime !== '终点站') {
                            const [depH, depM] = departTime.split(':').map(Number);
                            const [arrH, arrM] = arriveTime.split(':').map(Number);
                            
                            let totalMinutes = (arrH * 60 + arrM) - (depH * 60 + depM);
                            if (totalMinutes < 0) totalMinutes += 24 * 60;
                            
                            const hours = Math.floor(totalMinutes / 60);
                            const minutes = totalMinutes % 60;
                            
                            if (hours > 0) {
                                duration = `（${stationCount}站，${hours}小时${minutes}分钟）`;
                            } else {
                                duration = `（${stationCount}站，${minutes}分钟）`;
                            }
                        }
                    }
                }
                
                const date = new Date(train.depart_date);
                const weekDay = weekDays[date.getDay()];
                const dateStr = `${train.depart_date} ${weekDay}`;
                
                const item = document.createElement('div');
                item.className = 'train-item';
                item.dataset.trainKey = trainKey;
                
                const isChecked = selectedTrainKeys.includes(trainKey);
                
                item.innerHTML = `
                    <div class="train-item-checkbox">
                        <input type="checkbox" id="train-${index}" value="${trainKey}" ${isChecked ? 'checked' : ''}>
                    </div>
                    <div class="train-item-content">
                        <div class="train-item-date">${dateStr}</div>
                        <div class="train-item-info">
                            <span class="train-item-no">${train.train_no}</span>
                            <span class="train-item-route">${train.train_name} ${duration}</span>
                            <span class="train-item-time">${train.depart_time}</span>
                        </div>
                    </div>
                `;
                
                item.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const checkbox = item.querySelector('input[type="checkbox"]');
                        checkbox.checked = !checkbox.checked;
                    }
                    updateSelectedTrainKeys();
                };
                
                body.appendChild(item);
            });
            
            modal.classList.add('show');
        }
        
        // ============================================================
        // 【3】更新选中的车次列表
        // ============================================================
        
        /**
         * 【3.2】更新选中的车次列表
         * @description 根据复选框状态更新选中的车次列表，并重新渲染地图
         */
        function updateSelectedTrainKeys() {
            const checkboxes = document.querySelectorAll('#train-list-body input[type="checkbox"]:checked');
            selectedTrainKeys = Array.from(checkboxes).map(cb => cb.value);
            
            const trainDataList = selectedTrainKeys
                .map(key => TRAIN_DATA[key])
                .filter(data => data);
            
            if (trainDataList.length > 0) {
                renderMultipleTrains(trainDataList);
                
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('no', selectedTrainKeys.join(','));
                window.history.pushState({}, '', newUrl);
            } else {
                clearMapElements();
            }
        }

        // ============================================================
        // 【3】关闭车次列表弹框
        // ============================================================
        
        /**
         * 【3.3】关闭车次列表弹框
         * @description 关闭车次列表弹框
         */
        function closeTrainListModal() {
            const modal = document.getElementById('train-list-modal');
            modal.classList.remove('show');
        }

        // ============================================================
        // 【2】数据加载 - 从 Supabase 加载车次数据
        // ============================================================
        
        /**
         * 【2.2】从 Supabase 加载车次数据
         * @returns {Promise<boolean>} 加载成功返回 true，失败返回 false
         * @description 从 Supabase 数据库加载最近 10 条车次数据
         */
        async function fetchTrainData(retries = 3, timeoutMs = 8000) {
            // 2026-11-15：Supabase/web 网络抖动时原实现无超时，Promise 永不落地 ⇒
            // 一直停在「正在加载车次数据…」。现加超时 + 退避重试，最终失败给出可见错误。
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    const query = supabaseClient
                        .from('train_schedules')
                        .select('id, train_no, train_name, depart_date, ticket_checkpoint, seat, stations, created_at, updated_at')
                        .order('depart_date', { ascending: false })
                        .limit(10);
                    const timeout = new Promise((_, reject) => setTimeout(
                        () => reject(new Error(`请求超时（${timeoutMs}ms）`)), timeoutMs));
                    const { data, error } = await Promise.race([query, timeout]);

                    if (error) throw new Error(error.message || 'Supabase 返回错误');
                    if (!data || data.length === 0) {
                        console.warn('Supabase 返回空数据');
                        return false;
                    }

                    TRAIN_DATA = {};
                    TRAIN_LIST = [];

                    data.forEach(train => {
                        const key = `${train.depart_date.replace(/-/g, '')}-${train.train_no}`;
                        TRAIN_DATA[key] = {
                            train_no: train.train_no,
                            train_name: train.train_name,
                            depart_date: train.depart_date,
                            // v2.0.5: 座位/检票口原先被丢弃，购票段面板与复制文本要用
                            seat: train.seat || '',
                            ticket_checkpoint: train.ticket_checkpoint || '',
                            stations: train.stations || []
                        };

                        const firstStation = train.stations && train.stations[0];
                        TRAIN_LIST.push({
                            train_no: train.train_no,
                            train_name: train.train_name,
                            depart_date: train.depart_date,
                            depart_time: firstStation ? firstStation.departureTime : ''
                        });
                    });

                    console.log(`从 Supabase 加载 ${Object.keys(TRAIN_DATA).length} 条车次数据`
                        + (attempt > 1 ? `（第 ${attempt} 次尝试成功）` : ''));
                    return true;
                } catch (err) {
                    console.warn(`第 ${attempt}/${retries} 次加载车次数据失败:`, err && err.message);
                    if (attempt === retries) {
                        showError(`车次数据加载失败（网络）：${(err && err.message) || '未知错误'}，已回退内置数据`);
                        return false;
                    }
                    await new Promise(r => setTimeout(r, 800 * attempt));
                }
            }
            return false;
        }

        // ============================================================
        // 【7】交互处理 - 主函数
        // ============================================================
        
        /**
         * 【7.1】主函数
         * @description 初始化地图，加载车次数据，渲染路线和时刻表
         */
        async function main() {
            try {
                initMap();
                bindHeaderButtons();
                bindLaunchers();
                mobileTimetableMedia.addEventListener('change', syncTimetableColumns);
                syncTimetableColumns();
                
                const loadSuccess = await fetchTrainData();
                if (!loadSuccess) {
                    console.warn('从 Supabase 加载数据失败，将使用默认数据');
                }
                
                const trainData = loadTrainData();
                
                if (Array.isArray(trainData)) {
                    renderMultipleTrains(trainData);
                } else {
                    renderTrainData(trainData);
                }
                
                hideLoading();
            } catch (error) {
                console.error('初始化失败:', error);
                showError('页面初始化失败，请刷新重试');
                hideLoading();
            }
        }

        /**
         * 【7.2】页面加载完成事件处理
         * @description 页面加载完成后执行主函数
         */
        document.addEventListener('DOMContentLoaded', main);
    </script>
