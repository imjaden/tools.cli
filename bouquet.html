<!--
===========================================================================
Karpathy Principles - AI编程四大原则
===========================================================================
1. 先思考 - 不假设，不隐藏困惑 → 不确定就问，多种解释列出
2. 保持简单 - 最小代码解决问题 → 无多余抽象
3. 精准修改 - 只改必须改的 → 不"顺便"改进邻接代码
4. 目标驱动 - 测试先行，验证闭环 → "修bug"→"写测试复现→让测试通过"

Version: 1.0(2026-11-28)
Description
- 花束识花结果页 + 可复用契约：一份香槟玫瑰花束的逐类识别结果（花语/形态/香气/养护/目测支数/图中热点），
  同时把「识花 Prompt + 数据 schema」作为可复用资产暴露给 AI agent（一条链接 + 一次复制即可再开发）
- 数据单源：内联 <script type="application/json" id="bloom-data"> 为准，`bouquet-data.json` 为同源副本
  （pages-manager bundle 随页发布，供 agent 直接 GET）；两者解析后必须逐字相等（测试钉死）
- 复用面：`?id=<flowerId>` 直选某类花材 · `?prompt=1` 直开复用包弹窗 · 「复制给 AI」一次性拷走 Prompt + schema + 示例数据
- 来源：用户 2026-11-27 拍摄花束照片（原图 3000×4000，页面用 1400px 压缩版 400KB），v1.3 识别结果移植

【功能清单】
| 功能 | 说明 |
|------|------|
| 品类联动 | 左列品类 ↔ 图中热点框 ↔ 右列详情三处联动，点任一即选中 |
| 占比统计 | 仅 counts_in_bloom=true 的花材计入分母（本束 33 朵），叶材/配草不计 |
| 显示所有 | 勾选后每类只显示带名字标签的首框，避免画面糊成一团 |
| 复用包 | 「复制给 AI」弹窗：Prompt 全文 + schema 摘要 + 当前数据集 JSON，一键入剪贴板 |
| 本页数据 | 右列底部「数据契约」面板列出 schema_version / dataset / flowers 字段与直链 |
| 深链 | `?id=sunflower` 直接选中向日葵；`?prompt=1` 直接打开复用包 |
===========================================================================
-->

<script>
/* ══════════════════════════════════════════════════════════════════
   渲染层：只读 BLOOM_DATA，不含业务数据（数据改了不用动这里）
   ══════════════════════════════════════════════════════════════════ */
var BLOOM_DATA = JSON.parse(document.getElementById('bloom-data').textContent);
window.BLOOM_DATA = BLOOM_DATA;

var FLOWERS = BLOOM_DATA.flowers;
var DATASET = BLOOM_DATA.dataset;

/* 占比口径：counts_in_bloom=true 的品类进分母 */
var bloomTotal = FLOWERS.filter(function (f) { return f.counts_in_bloom; })
  .reduce(function (s, f) { return s + (f.count_num || 0); }, 0);

function ratioOf(f) {
  if (!f.counts_in_bloom) return null;
  return ((f.count_num / bloomTotal) * 100).toFixed(1) + '%';
}

/* ===== 深链状态 ===== */
var qs = new URLSearchParams(location.search);
var requestedId = qs.get('id');
var selectedId = FLOWERS.some(function (f) { return f.id === requestedId; }) ? requestedId : FLOWERS[0].id;
var showAll = false;

var listEl = document.getElementById('list');
var hotEl = document.getElementById('hotspots');
var detailEl = document.getElementById('detail');

/* 顶栏/页脚事实行（全部来自数据，避免文案与数据两处维护） */
document.getElementById('topSub').textContent =
  DATASET.title + ' · ' + FLOWERS.length + ' 类 · 主配花 ' + bloomTotal + ' 朵';
document.getElementById('footMeta').textContent =
  '版本 1.0(2026-11-28) · 识别 ' + DATASET.counted_at + ' · 数据更新 ' + DATASET.updated_at +
  ' · schema v' + BLOOM_DATA.schema_version;

function renderList() {
  var html =
    '<div class="list-head">' +
      '<h2>花束品类</h2>' +
      '<button class="ai-btn" id="aiBtn" title="查看复用包（Prompt + 契约）" aria-label="查看复用包">' +
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l1.8 5.6L19.5 9l-5.7 1.8L12 16.4 10.2 10.8 4.5 9l5.7-1.4L12 2zm7 10l.9 2.6 2.6.9-2.6.9L19 19l-.9-2.6-2.6-.9 2.6-.9L19 12zM5 14l.7 2.1L7.8 16.8l-2.1.7L5 19.6l-.7-2.1-2.1-.7 2.1-.7L5 14z"/></svg>' +
      '</button>' +
    '</div>' +
    '<div class="total-line">共识别 <b>' + FLOWERS.length + '</b> 类 · 主配花约 <b>' + bloomTotal + '</b> 朵</div>';

  FLOWERS.forEach(function (f) {
    var ratio = ratioOf(f);
    html +=
      '<div class="flower-item' + (f.id === selectedId ? ' active' : '') + '" data-id="' + f.id + '">' +
        '<span class="dot" style="background:' + f.color + '"></span>' +
        '<span class="meta"><div class="name">' + f.name + '</div>' +
        '<div class="alias">' + f.alias + '</div></span>' +
        '<span class="count">' + f.count_text + (ratio ? '<div class="ratio">' + ratio + '</div>' : '') + '</span>' +
      '</div>';
  });

  html += '<label class="radio-row"><input type="checkbox" id="showAll" ' +
          (showAll ? 'checked' : '') + '> 显示所有花卉</label>';

  listEl.innerHTML = html;

  listEl.querySelectorAll('[data-id]').forEach(function (el) {
    el.addEventListener('click', function () { select(el.dataset.id); });
  });
  document.getElementById('showAll').addEventListener('change', function (e) {
    showAll = e.target.checked;
    renderHotspots();
  });
  document.getElementById('aiBtn').addEventListener('click', openModal);
}

/* 热点：显示所有时每类只留带名字的首框；未选中类淡显但仍可点 */
function renderHotspots() {
  hotEl.innerHTML = '';
  FLOWERS.forEach(function (f) {
    var active = f.id === selectedId;
    f.hotspots.forEach(function (r, i) {
      if (showAll && i !== 0) return;
      var visible = showAll || active;
      var box = document.createElement('div');
      box.className = 'hotspot' + (visible ? '' : ' dim');
      box.style.left = (r.x * 100) + '%';
      box.style.top = (r.y * 100) + '%';
      box.style.width = (r.w * 100) + '%';
      box.style.height = (r.h * 100) + '%';
      box.style.borderColor = f.color;
      box.style.background = f.color + (active ? '33' : '1f');
      box.title = f.name;
      if (i === 0 && visible) {
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.style.background = f.color;
        tag.style.color = '#3d3327';
        tag.textContent = f.name;
        box.appendChild(tag);
      }
      box.addEventListener('click', function (e) { e.stopPropagation(); select(f.id); });
      hotEl.appendChild(box);
    });
  });
}

function renderDetail() {
  var f = FLOWERS.filter(function (x) { return x.id === selectedId; })[0];
  var ratio = ratioOf(f);
  detailEl.innerHTML =
    '<div class="detail">' +
      '<span class="badge">' + f.role + '</span>' +
      '<h2>' + f.name + '</h2>' +
      '<div class="alias">' + f.alias + ' · ' + f.count_text + (ratio ? ' · 占比 ' + ratio : '') + '</div>' +
      '<section><h3>花语寓意</h3><p>' + f.meaning + '</p></section>' +
      '<section><h3>形态特性</h3><p>' + f.feature + '</p></section>' +
      '<section><h3>花香气味</h3><p>' + f.scent + '</p></section>' +
      '<section><h3>养护要点</h3><p>' + f.care + '</p></section>' +
      '<section><h3>标签</h3><div class="tags">' +
        f.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('') +
      '</div></section>' +
      renderContract() +
    '</div>';
}

/* 数据契约面板：agent 侧一眼看到能读什么、去哪读 */
function renderContract() {
  var f = FLOWERS.filter(function (x) { return x.id === selectedId; })[0];
  return '<section class="contract">' +
    '<h3>数据契约（agent 复用）</h3>' +
    '<dl>' +
      '<dt>schema</dt><dd>v' + BLOOM_DATA.schema_version + ' · hotspots 归一化 {x,y,w,h} 0~1</dd>' +
      '<dt>dataset.id</dt><dd>' + DATASET.id + '</dd>' +
      '<dt>本类 id</dt><dd><code>' + f.id + '</code> · count_num=' + f.count_num +
        ' · counts_in_bloom=' + f.counts_in_bloom + '</dd>' +
      '<dt>JSON 直链</dt><dd><a href="/bouquet-data.json">bouquet-data.json</a></dd>' +
      '<dt>深链</dt><dd>?id=' + f.id + ' · ?prompt=1</dd>' +
    '</dl>' +
    '<div class="hintline">新花束照做：把图片交给 agent → 用复用包 Prompt → 按同 schema 回填 flowers 数组 → 换掉本页数据块与 bouquet-data.json 即得新页。</div>' +
  '</section>';
}

function select(id) {
  selectedId = id;
  showAll = false;
  renderList();
  renderHotspots();
  renderDetail();
  var active = listEl.querySelector('.flower-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

/* ===== 复用包（Prompt + 契约 + 示例数据） ===== */
var AGENT_BRIEF = [
  '【花束识花 · 可复用契约 v' + BLOOM_DATA.schema_version + '】',
  '来源页面: https://tools.cli.jaden.tech/bouquet.html',
  '数据直链: https://tools.cli.jaden.tech/bouquet-data.json',
  '',
  '任务: 给我任意一张花束照片，按下面的 Prompt 识别，并按 schema 输出 JSON（自然语言解读 + 一个 json 代码块）。',
  '占比口径: 只统计 counts_in_bloom=true 的品类，分母为它们的 count_num 之和；叶材/配草不计。',
  '',
  '【Prompt】',
  BLOOM_DATA.prompt.text,
  '',
  '【schema 摘要】',
  'schema_version: string',
  'dataset: {id, title, image, image_alt, image_size:[w,h], source, counted_at, updated_at, count_note, hotspot_space}',
  'prompt: {version, label, text}',
  'flowers[]: {id, name, alias, role, color, count_text, count_num, counts_in_bloom, meaning, feature, scent, care, tags[], hotspots[{x,y,w,h}]}',
  '',
  '【本图示例数据（可直接替换为新花束结果）】',
  JSON.stringify(BLOOM_DATA, null, 2)
].join('\n');

var modal = document.getElementById('promptModal');
var promptText = document.getElementById('promptText');
promptText.value = AGENT_BRIEF;

function openModal() { modal.classList.add('open'); }
function closeModal() { modal.classList.remove('open'); }

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
document.getElementById('topPrompt').addEventListener('click', openModal);
document.getElementById('topCopy').addEventListener('click', openModal);

document.getElementById('copyBtn').addEventListener('click', function () {
  var btn = document.getElementById('copyBtn');
  var old = btn.textContent;
  function done() { btn.textContent = '已复制 ✓'; setTimeout(function () { btn.textContent = old; }, 1500); }
  promptText.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(promptText.value).then(done).catch(function () {
      document.execCommand('copy'); done();
    });
  } else {
    document.execCommand('copy'); done();
  }
});

renderList();
renderHotspots();
renderDetail();
if (qs.get('prompt') === '1') openModal();
</script>
